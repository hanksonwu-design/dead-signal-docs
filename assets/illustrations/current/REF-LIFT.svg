<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1441" viewBox="0 0 1200 1441" role="img" aria-labelledby="title desc" data-layout="visual-v1">
<title id="title">REF-LIFT｜L1／L2 · 鐵拉閘門與真假停靠</title><desc id="desc">每次抵達仍在車廂內；核對實體地標後，由玩家開閘與跨平台。 L1 · B 棟 29F → 30F：倒影開閘，實閘仍鎖住：只開放 30F 按鈕，先閉閘才上行。
核對實閘後倒影復位，不新增停靠樓層。；L1 · 30F 平台：踏板雙端卡榫＋檢修柄：從原凹槽取踏板，兩端卡妥才可踩過。
操作檢修柄後回車廂，才開放 31F。
未啟用時仍可依原規則回 29F。；L1 · 30F → 31F：閉雙閘 → 按樓層 → 手動離車：核 B 棟 31F 樓牌與平層線，再開閘。
跨原門口才到訪 R16；略過動畫不代跨門。；L2 · B 棟 47F → 48F：假停靠燈亮，門後卻是實牆：沒有平台，閘鎖不鬆，拉閘只碰止擋。
空布袋在車內；刮聲不證明有人。
取消查看可繼續，不新增暗樓層。；L2 · 真 48F：實體樓牌＋平層線＋完整踏面：三項核對後親手開閘、過平台，再進 U4。
R30 不可逆邊界前仍可依原路回 47F。；停靠界線：兩部梯不共用任意樓層：L1：29F／30F／31F，已完成平台按原條件回訪。
L2：47F／48F，假停靠不算新場景。
門閘、平台與房間入口分開交圖。</desc>
