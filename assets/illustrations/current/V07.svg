<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="734" viewBox="0 0 1200 734" role="img" aria-labelledby="title desc">
<title id="title">V07｜R18 · B 棟 37F 聽覺潛行</title><desc id="desc">正常巡行與發現後警戒分開；巡行不補腳步或拖曳聲。 正常巡行：先看位置，再判斷移動：看門牌、水痕、布簾及振膜。
輪廓沿原方向檢查，尚未發現玩家。
只有原階段已有的呼吸才入現場帶。；現場聽覺帶：現在 · 隨已發生聲音更新：方向文字、音量包絡與波形同步。
音量不是距離尺；配合視線與遮擋。
無聲模式保留同等輪廓與方向資訊。；被注意：失誤後才進警戒：收手，按原 2.2 秒救援窗退避。
部分掩體須屏息，按鍵讀目前綁定。
不以假方向聲或突增爆音誤導。；復位與通過：只退到已到達的安全位：復位按 N0／N1／N3 已到達狀態。
N2 不是失敗復位點；N4 是通過終態。
安全後仍由玩家親手開門去 R19。</desc>
