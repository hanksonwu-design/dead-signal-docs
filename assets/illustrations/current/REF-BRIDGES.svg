<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">REF-BRIDGES｜四條 24–26F 分岔跨棟路</title><desc id="desc">各列是不同路線，平台不互接；真正通行條件依出發房、目的房與原路線。；跨棟發生在 26F；房內門端與樓梯各自操作，不由本圖提供越級通行。；R12→R14 探路含旁通／關漏水；其他支路沿原後勤、診所與回程條件。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79d8dc"/></marker></defs>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;letter-spacing:0}</style>
<rect width="1200" height="1200" fill="#0b1418"/>
<text x="32" y="52" font-size="30" fill="#edf1ef">REF-BRIDGES｜四條 24–26F 分岔跨棟路</text><text x="32" y="94" font-size="20" fill="#b3c1c5">各列是不同路線，平台不互接；真正通行條件依出發房、目的房與原路線。</text>
<text x="32" y="145" font-size="25" fill="#a6cfa7">R12 → R14｜依原條件可回訪</text><rect x="32" y="170" width="364" height="130" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="52" y="204" font-size="24" fill="#79d8dc">24F · A 棟</text><text x="52" y="239" font-size="20" fill="#edf1ef">T-R12-R14-01</text><text x="52" y="268" font-size="20" fill="#edf1ef">焊封中繼平台</text><polyline points="396,232 414,232" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="418" y="170" width="364" height="130" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="438" y="204" font-size="24" fill="#79d8dc">25F · A 棟</text><text x="438" y="239" font-size="20" fill="#edf1ef">T-R12-R14-02</text><text x="438" y="268" font-size="20" fill="#edf1ef">配重車停靠臺</text><polyline points="782,232 800,232" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="804" y="170" width="364" height="130" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="824" y="204" font-size="24" fill="#e6bc68">26F · A 棟 → B 棟</text><text x="824" y="239" font-size="20" fill="#edf1ef">T-R12-R14-03</text><text x="824" y="268" font-size="20" fill="#edf1ef">冷卻水旁通跨棟廊</text><text x="32" y="337" font-size="21" fill="#edf1ef">R12 在 A 棟 23F 出發；26F 同層過橋後，沿 B 棟短梯到 R14（27F）。</text><text x="32" y="375" font-size="25" fill="#a6cfa7">R13 → R14｜依原條件可回訪</text><rect x="32" y="400" width="364" height="130" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="52" y="434" font-size="24" fill="#79d8dc">24F · A 棟</text><text x="52" y="469" font-size="20" fill="#edf1ef">T-R13-R14-01</text><text x="52" y="498" font-size="20" fill="#edf1ef">診所後簾送物平台</text><polyline points="396,462 414,462" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="418" y="400" width="364" height="130" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="438" y="434" font-size="24" fill="#79d8dc">25F · A 棟</text><text x="438" y="469" font-size="20" fill="#edf1ef">T-R13-R14-02</text><text x="438" y="498" font-size="20" fill="#edf1ef">廚房背側轉梯</text><polyline points="782,462 800,462" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="804" y="400" width="364" height="130" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="824" y="434" font-size="24" fill="#e6bc68">26F · A 棟 → B 棟</text><text x="824" y="469" font-size="20" fill="#edf1ef">T-R13-R14-03</text><text x="824" y="498" font-size="20" fill="#edf1ef">送物跨棟廊</text><text x="32" y="567" font-size="21" fill="#edf1ef">R13 在 A 棟 23F 出發；26F 同層過橋後，沿 B 棟短梯到 R14（27F）。</text><text x="32" y="605" font-size="25" fill="#a6cfa7">R13 → R15｜依原條件可回訪</text><rect x="32" y="630" width="364" height="130" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="52" y="664" font-size="24" fill="#79d8dc">24F · A 棟</text><text x="52" y="699" font-size="20" fill="#edf1ef">T-R13-R15-01</text><text x="52" y="728" font-size="20" fill="#edf1ef">診所後勤管廊</text><polyline points="396,692 414,692" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="418" y="630" width="364" height="130" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="438" y="664" font-size="24" fill="#79d8dc">25F · A 棟</text><text x="438" y="699" font-size="20" fill="#edf1ef">T-R13-R15-02</text><text x="438" y="728" font-size="20" fill="#edf1ef">排氣背側折梯</text><polyline points="782,692 800,692" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="804" y="630" width="364" height="130" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="824" y="664" font-size="24" fill="#e6bc68">26F · A 棟 → B 棟</text><text x="824" y="699" font-size="20" fill="#edf1ef">T-R13-R15-03</text><text x="824" y="728" font-size="20" fill="#edf1ef">照護後勤跨棟廊</text><text x="32" y="797" font-size="21" fill="#edf1ef">R13 在 A 棟 23F 出發；26F 同層過橋後，沿 B 棟短梯到 R15（27F）。</text><text x="32" y="835" font-size="25" fill="#a6cfa7">R12 → R15｜依原條件可回訪</text><rect x="32" y="860" width="364" height="130" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="52" y="894" font-size="24" fill="#79d8dc">24F · A 棟</text><text x="52" y="929" font-size="20" fill="#edf1ef">T-R12-R15-01</text><text x="52" y="958" font-size="20" fill="#edf1ef">回程閥箱外廊</text><polyline points="396,922 414,922" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="418" y="860" width="364" height="130" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="438" y="894" font-size="24" fill="#79d8dc">25F · A 棟</text><text x="438" y="929" font-size="20" fill="#edf1ef">T-R12-R15-02</text><text x="438" y="958" font-size="20" fill="#edf1ef">回程配重隔牆</text><polyline points="782,922 800,922" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="804" y="860" width="364" height="130" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="824" y="894" font-size="24" fill="#e6bc68">26F · A 棟 → B 棟</text><text x="824" y="929" font-size="20" fill="#edf1ef">T-R12-R15-03</text><text x="824" y="958" font-size="20" fill="#edf1ef">低負荷回程跨棟廊</text><text x="32" y="1027" font-size="21" fill="#edf1ef">R12 在 A 棟 23F 出發；26F 同層過橋後，沿 B 棟短梯到 R15（27F）。</text>
<polyline points="32,1074 1168,1074" fill="none" stroke="#425155" stroke-width="3"/>
<text x="32" y="1106" font-size="20" fill="#b3c1c5">跨棟發生在 26F；房內門端與樓梯各自操作，不由本圖提供越級通行。</text><text x="32" y="1135" font-size="20" fill="#b3c1c5">R12→R14 探路含旁通／關漏水；其他支路沿原後勤、診所與回程條件。</text>
<text x="32" y="1175" font-size="18" fill="#b3c1c5">製作圖解 · 非遊戲介面或完成素材 · 正式差分及比例依本房工單驗收</text>
