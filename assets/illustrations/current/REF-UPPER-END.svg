<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
<title id="title">REF-UPPER-END｜上部兩種解法與同一出口</title><desc id="desc">B 棟 R22 · 30F；不新增第二扇出口，不用關門字幕代替突破成果。；手勢路原噤聲者低頭 6 秒；手動路仍直立，都是機構讓路，沒有抹除任何人。；手動路移動與操作窗分開計時；完成不自動跨門或直接進下部。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79d8dc"/></marker></defs>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;letter-spacing:0}</style>
<rect width="1200" height="1120" fill="#0b1418"/>
<text x="32" y="52" font-size="30" fill="#edf1ef">REF-UPPER-END｜上部兩種解法與同一出口</text><text x="32" y="94" font-size="20" fill="#b3c1c5">B 棟 R22 · 30F；不新增第二扇出口，不用關門字幕代替突破成果。</text>
<rect x="32" y="140" width="530" height="350" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="174" font-size="24" fill="#e6bc68">快速釋放：四次正確輸入</text><text x="52" y="209" font-size="20" fill="#edf1ef">1 指節敲門框</text><text x="52" y="238" font-size="20" fill="#edf1ef">2 指節再敲門框</text><text x="52" y="267" font-size="20" fill="#edf1ef">3 左掌向下</text><text x="52" y="296" font-size="20" fill="#edf1ef">4 左掌再向下</text><text x="52" y="325" font-size="20" fill="#edf1ef">門控用既有憑據驗證後退栓</text><rect x="638" y="140" width="530" height="350" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="658" y="174" font-size="24" fill="#79d8dc">手動釋放：兩個安全窗</text><text x="658" y="209" font-size="20" fill="#edf1ef">第一窗到 A：長按 3 秒解防火扣</text><text x="658" y="238" font-size="20" fill="#edf1ef">退回完整掩體</text><text x="658" y="267" font-size="20" fill="#edf1ef">第二窗到 B：拉下釋放桿</text><text x="658" y="296" font-size="20" fill="#edf1ef">A 完成仍未開通，成果保留</text><text x="658" y="325" font-size="20" fill="#edf1ef">兩道機構到位才接上踏面</text><polyline points="300,490 300,535 600,535 600,580" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><polyline points="900,490 900,535 600,535" fill="none" stroke="#79d8dc" stroke-width="3"/><rect x="240" y="590" width="720" height="140" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="260" y="624" font-size="24" fill="#a6cfa7">同一扇門／同一段可走踏面</text><text x="260" y="659" font-size="20" fill="#edf1ef">兩路沿同一鏡位：退栓、完整踏面、連續扶手</text><text x="260" y="688" font-size="20" fill="#edf1ef">門維持開啟，玩家自行走到安全踏台</text><polyline points="600,730 600,770" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="240" y="785" width="720" height="135" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="260" y="819" font-size="24" fill="#a6cfa7">跨門提交 → 保存上部進度 → 片尾</text><text x="260" y="854" font-size="20" fill="#edf1ef">布結與空掌懸念沿原門檻演出</text><text x="260" y="883" font-size="20" fill="#edf1ef">下部匯入／獨立開局不虛構未做的選擇</text>
<polyline points="32,994 1168,994" fill="none" stroke="#425155" stroke-width="3"/>
<text x="32" y="1026" font-size="20" fill="#b3c1c5">手勢路原噤聲者低頭 6 秒；手動路仍直立，都是機構讓路，沒有抹除任何人。</text><text x="32" y="1055" font-size="20" fill="#b3c1c5">手動路移動與操作窗分開計時；完成不自動跨門或直接進下部。</text>
<text x="32" y="1095" font-size="18" fill="#b3c1c5">製作圖解 · 非遊戲介面或完成素材 · 正式差分及比例依本房工單驗收</text>
</svg>
