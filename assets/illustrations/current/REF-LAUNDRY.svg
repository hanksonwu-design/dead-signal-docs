<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc">
<title id="title">REF-LAUNDRY｜雙鏈與上下層連動剖面</title><desc id="desc">B 棟 46F／橋下夾層；上層試動不算收架完成，下層凹位不是出口。；只有兩條鏈；實線承重、虛線空轉，並用文字區分，不只靠顏色。；失敗保留已完成段；晾架清通後不搬運玩家、不自動切房。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79d8dc"/></marker></defs>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;letter-spacing:0}</style>
<rect width="1200" height="1180" fill="#0b1418"/>
<text x="32" y="52" font-size="30" fill="#edf1ef">REF-LAUNDRY｜雙鏈與上下層連動剖面</text><text x="32" y="94" font-size="20" fill="#b3c1c5">B 棟 46F／橋下夾層；上層試動不算收架完成，下層凹位不是出口。</text>
<rect x="32" y="140" width="1136" height="665" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="62" y="180" font-size="26" fill="#a6cfa7">U2 · 46F 上層內井</text><polyline points="65,310 340,310 340,340 785,340 785,310 1140,310" fill="none" stroke="#87999d" stroke-width="3"/><text x="70" y="275" font-size="22" fill="#edf1ef">來路門</text><text x="810" y="275" font-size="22" fill="#edf1ef">受阻原橋面 → 清出後通 U3</text><rect x="425" y="245" width="315" height="65" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="475" y="285" font-size="22" fill="#e6bc68">同一組懸空晾架</text><polyline points="485,310 485,550 625,550" fill="none" stroke="#e6bc68" stroke-width="3"/><text x="290" y="420" font-size="22" fill="#e6bc68">承重牽引鏈</text><polyline points="770,180 770,450 940,450" fill="none" stroke="#79d8dc" stroke-width="3" stroke-dasharray="8 6"/><text x="827" y="405" font-size="21" fill="#edf1ef">空轉鏈 → 空曬衣桿</text><rect x="60" y="515" width="270" height="118" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="80" y="549" font-size="24" fill="#79d8dc">固定短階</text><text x="80" y="584" font-size="20" fill="#edf1ef">U2 → U2b</text><text x="80" y="613" font-size="20" fill="#edf1ef">不是跨橋捷徑</text><polyline points="200,640 200,700 405,700" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="425" y="500" width="330" height="220" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="445" y="534" font-size="24" fill="#79d8dc">U2b · 橋下操作台</text><text x="445" y="569" font-size="20" fill="#edf1ef">手輪／兩止點／離合柄</text><text x="445" y="598" font-size="20" fill="#edf1ef">首次正式轉輪才啟動</text><text x="445" y="627" font-size="20" fill="#edf1ef">每次安全窗轉 1.5 秒</text><text x="445" y="656" font-size="20" fill="#edf1ef">共兩段，已完成段數保存</text><rect x="820" y="520" width="315" height="135" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="840" y="554" font-size="24" fill="#a6cfa7">乾燥凹位</text><text x="840" y="589" font-size="20" fill="#edf1ef">先收手退入，再等掃擊</text><text x="840" y="618" font-size="20" fill="#edf1ef">受擊後安全復位離合柄</text><polyline points="755,600 815,600" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><polyline points="755,690 1035,690 1035,322" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><text x="815" y="760" font-size="21" fill="#a6cfa7">完成兩段後走側階上原橋</text><rect x="32" y="850" width="1136" height="150" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="52" y="884" font-size="24" fill="#79d8dc">操作順序</text><text x="52" y="919" font-size="20" fill="#edf1ef">U2 辨鏈 → 安全試動 → 解煞扣 → 確認凹位 → 下短階</text><text x="52" y="948" font-size="20" fill="#edf1ef">U2b 兩段收架 → 原橋清出 → 側階上橋 → 自行進 U3</text>
<polyline points="32,1054 1168,1054" fill="none" stroke="#425155" stroke-width="3"/>
<text x="32" y="1086" font-size="20" fill="#b3c1c5">只有兩條鏈；實線承重、虛線空轉，並用文字區分，不只靠顏色。</text><text x="32" y="1115" font-size="20" fill="#b3c1c5">失敗保留已完成段；晾架清通後不搬運玩家、不自動切房。</text>
<text x="32" y="1155" font-size="18" fill="#b3c1c5">製作圖解 · 非遊戲介面或完成素材 · 正式差分及比例依本房工單驗收</text>
</svg>
