<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1846" viewBox="0 0 1200 1846" role="img" aria-labelledby="title desc" data-layout="visual-v1">
<title id="title">V02｜筆記本 · 四種碎片與來源</title><desc id="desc">來源分類不等於解鎖順序；只保存玩家已取得的資訊。 物證：縮圖＋描述：實體物件、全家福、繃布等。
保留取得位置與原件連結。
帶文字的物件依實際讀取內容另標文證。；聲證：來源摘要＋主觀回想：現場設備播放客觀原音。
筆記保存來源與已聽摘要。
歷史錄音不是現場威脅雷達。；影證：定格畫面：監控截圖或原指定凝固瞬間。
原畫幅、時間與遮擋一起保存。
單張影格不證明畫外事件。；文證：放大閱讀：檔案、備忘、簽核紀錄與刻痕。
保留頁次、正反面與來源。
必要閱讀不受攻擊計時干擾。；觀察：當時的位置與阻礙：只記已見出口、已到位置與尋路目標。
不顯示尚未探索的全樓層地圖。；關聯：保留待查證狀態：手動連起已看來源；錯配可拆線。
同名或相似外觀不自動證明因果。；路線：已走與未知通路分開：只標已走路段及已見的未確認通路。
查看路線不等於取得傳送權限。；播放：聲源留在現場：已核對原音由當地有電設備輸出。
筆記只記來源，不新增遠端播放能力。</desc>
