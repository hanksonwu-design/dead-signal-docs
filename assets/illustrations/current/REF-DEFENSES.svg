<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc">
<title id="title">REF-DEFENSES｜兩位角色的結構與不同防禦</title><desc id="desc">折線是拆件連接關係，不是新增骨架尺寸；完整形體仍依原角色比例。；R11 有效校驗優先停攻；R26 四來源齊全永久停攻，再做三卡與處置。；避開鉤臂不等於最終拒絕；所有防禦不代替必要查證或門端操作。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79d8dc"/></marker></defs>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;letter-spacing:0}</style>
<rect width="1200" height="1180" fill="#0b1418"/>
<text x="32" y="52" font-size="30" fill="#edf1ef">REF-DEFENSES｜兩位角色的結構與不同防禦</text><text x="32" y="94" font-size="20" fill="#b3c1c5">折線是拆件連接關係，不是新增骨架尺寸；完整形體仍依原角色比例。</text>
<rect x="32" y="140" width="530" height="170" rx="4" fill="#152025" stroke="#dcb3e4" stroke-width="2"/><text x="52" y="174" font-size="24" fill="#dcb3e4">阿尋 · 同一雙手的節指</text><text x="52" y="209" font-size="20" fill="#edf1ef">肩 → 原手臂 → 原手掌 → 多折指節</text><text x="52" y="238" font-size="20" fill="#edf1ef">沿單側桌沿，對側凹位仍空</text><text x="52" y="267" font-size="20" fill="#edf1ef">三層笑膜不是三個人頭</text><rect x="638" y="140" width="530" height="170" rx="4" fill="#152025" stroke="#ffa18b" stroke-width="2"/><text x="658" y="174" font-size="24" fill="#ffa18b">阿彪 · 同一臂的兩段反肘</text><text x="658" y="209" font-size="20" fill="#edf1ef">肩 → 上臂 → 反肘一 → 反肘二</text><text x="658" y="238" font-size="20" fill="#edf1ef">→ 同一手掌／鉤腕 → 拉柄</text><text x="658" y="267" font-size="20" fill="#edf1ef">硬殼沿雙層制服，不另長背部手臂</text><polyline points="80,385 210,385 265,445 325,385 380,445 510,445" fill="none" stroke="#dcb3e4" stroke-width="3"/><text x="100" y="430" font-size="21" fill="#edf1ef">原臂</text><text x="380" y="492" font-size="21" fill="#edf1ef">同一手掌</text><polyline points="690,385 805,385 745,455 880,455 830,525 1040,525" fill="none" stroke="#ffa18b" stroke-width="3"/><rect x="32" y="590" width="1136" height="80" rx="4" fill="#152025" stroke="#dcb3e4" stroke-width="2"/><text x="52" y="624" font-size="24" fill="#dcb3e4">AX-01｜眼形對準終端 → 關本地介面、停操作</text><text x="52" y="659" font-size="20" fill="#edf1ef"></text><rect x="32" y="690" width="1136" height="80" rx="4" fill="#152025" stroke="#dcb3e4" stroke-width="2"/><text x="52" y="724" font-size="24" fill="#dcb3e4">AX-02｜單側三抓痕 → 收手退來向對側凹位</text><text x="52" y="759" font-size="20" fill="#edf1ef"></text><rect x="32" y="790" width="1136" height="80" rx="4" fill="#152025" stroke="#ffa18b" stroke-width="2"/><text x="52" y="824" font-size="24" fill="#ffa18b">AB-01｜受力框壓單側 → 收手退另一側椅邊</text><text x="52" y="859" font-size="20" fill="#edf1ef"></text><rect x="32" y="890" width="1136" height="80" rx="4" fill="#152025" stroke="#ffa18b" stroke-width="2"/><text x="52" y="924" font-size="24" fill="#ffa18b">AB-02｜鉤臂牽拉柄 → 主動鬆柄、停止操作</text><text x="52" y="959" font-size="20" fill="#edf1ef"></text>
<polyline points="32,1054 1168,1054" fill="none" stroke="#425155" stroke-width="3"/>
<text x="32" y="1086" font-size="20" fill="#b3c1c5">R11 有效校驗優先停攻；R26 四來源齊全永久停攻，再做三卡與處置。</text><text x="32" y="1115" font-size="20" fill="#b3c1c5">避開鉤臂不等於最終拒絕；所有防禦不代替必要查證或門端操作。</text>
<text x="32" y="1155" font-size="18" fill="#b3c1c5">製作圖解 · 非遊戲介面或完成素材 · 正式差分及比例依本房工單驗收</text>
</svg>
