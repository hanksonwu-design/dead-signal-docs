<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="886" viewBox="0 0 1200 886" role="img" aria-labelledby="title desc">
<title id="title">V38｜R32 · 小花三拍防禦</title><desc id="desc">原身量人形、低垂翼拱、四鬚兩左兩右；雙揭露完成後才顯形。 開始前：安全觀察與自行確認：先看桌下低縫、門框退線、斷鉚釘與扶手。
顯形期間不判攻擊；玩家確認才開始。；第一拍 · XH-01：腰高掃線 → 桌下低位：3.5 秒灰粉掃線；桌架低縫仍空。
側牆仍在掃線內，不是這一拍的正解。；第二拍 · XH-02：抱繭 → 收手退過門框線：3.5 秒薄膜包向桌下與兩側。
一次操作完成撤手與後退，蹲低無效。；第三拍 · XH-03：灰粉 → 核對真實側牆：3.5 秒內看斷鉚釘與連續扶手。
假門沒有相接扶手；不靠聲音標出答案。；失敗與恢復：只重試當拍：保留已過拍數，六秒恢復後給完整前兆。
不扣新資源，不自動選留下結局。；防禦完成：停戰不等於解封：三拍後才開五路關係行動。
A／B／C 放行、D 留下、E 接管，各依原提交。</desc>
