<title id="title">V24｜R20～R22 · 校正與同一出口</title><desc id="desc">來源錄音與現場威脅分開；兩種釋放方法通往同一扇門。 R20 · 28F：三條歷史聲軌：固定台反覆查來源與日期。
歷史播放器不是怨靈距離圖。
現場聽覺帶另框，安全查聽停攻。；R20 · 同一玻璃：兩側位置可對照：玻璃、門框與現有通路維持原址。
輪廓依當前原觸發顯示，不另開房間。；R21 · 29F：折痕排程與實景核對：依既有上行次場景抵達，查小花換工申請與處理回覆，分清退回處置與維持原組，併原三單核對。
折痕、頁面和實景對位，不憑空補來源。；R22 · 30F：手勢路／手動路 → 同一出口：擇一完成原釋放機構，踏面與扶手落位。
玩家自行跨門，才保存上部完成。
深入下一區，不是全樓解封或已逃出。</desc>
