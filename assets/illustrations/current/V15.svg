<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="734" viewBox="0 0 1200 734" role="img" aria-labelledby="title desc">
<title id="title">V15｜D／E · 主動提交與不同後果</title><desc id="desc">互斥關係行動；長按完成前可取消，完成後不能由片尾重新選擇。 D · 準備：回看肉身與不回返後果：看明 P1 肉身仍活著、本次不回返、封鎖持續。
自行確認，四秒長按或等價輔助完成才提交。
閒置與預覽不算同意。；D · 結果：主觀坐下，翼膜留置：兩椅靠近，遠窗仍被封住。
肉身昏迷存活，不發求援、不接 P1 回返。；E · 準備：本地主管控制器：核對來源、錨點、供電及權限。
預覽索引撤銷、抹除、切中繼與機械封存。
四秒操作可取消，完成才提交。；E · 結果：局部錨點鬆斷，接肉身回返：硬碟與原件仍留本地，主角記憶保留。
獨立定位沿原排程一次，接回返與救援。
不是遠端清除全樓或赦免責任。</desc>
