<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
<title id="title">REF-CALIBRATION｜三房遮蔽與同片玻璃</title><desc id="desc">R18／R19／R20 均在 B 棟 28F；位置關係供鏡位校核，不是新增建築尺寸。；門牌、水痕、布簾與振膜可辨；巡行不新增腳步濺水聲。；R19 慢關門與屏息、R20 現場聽覺與歷史聲軌，沿各自安全規則。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79d8dc"/></marker></defs>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;letter-spacing:0}</style>
<rect width="1200" height="1100" fill="#0b1418"/>
<text x="32" y="52" font-size="30" fill="#edf1ef">REF-CALIBRATION｜三房遮蔽與同片玻璃</text><text x="32" y="94" font-size="20" fill="#b3c1c5">R18／R19／R20 均在 B 棟 28F；位置關係供鏡位校核，不是新增建築尺寸。</text>
<rect x="32" y="140" width="1136" height="302" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="52" y="174" font-size="24" fill="#79d8dc">R18 · 28F 校正走廊／俯視關係示意</text><text x="52" y="209" font-size="20" fill="#edf1ef"></text><rect x="62" y="225" width="190" height="80" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="78" y="272" font-size="23" fill="#edf1ef">N0 入口</text><polyline points="252,265 279,265" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="282" y="225" width="190" height="80" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="298" y="272" font-size="23" fill="#edf1ef">N1 推車</text><polyline points="472,265 499,265" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="502" y="225" width="190" height="80" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="518" y="272" font-size="23" fill="#edf1ef">N2 門凹</text><polyline points="692,265 719,265" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="722" y="225" width="190" height="80" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="738" y="272" font-size="23" fill="#edf1ef">N3 布簾</text><polyline points="912,265 939,265" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="942" y="225" width="190" height="80" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="958" y="272" font-size="23" fill="#edf1ef">N4 門前</text><text x="62" y="352" font-size="20" fill="#edf1ef">N0→N1：2.2／4.0 秒   N1→N2：1.6／3.2 秒   N2→N3：2.8／3.8 秒   N3→N4：2.2／3.4 秒</text><text x="62" y="396" font-size="21" fill="#e6bc68">失敗復位只用已到達完整掩體：N0／N1／N3；N2 不是失敗復位點。</text><rect x="32" y="496" width="530" height="285" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="52" y="530" font-size="24" fill="#79d8dc">R19 · 收容側</text><text x="52" y="565" font-size="20" fill="#edf1ef">入口隔音門 → 牆角 → 固定空椅</text><text x="52" y="594" font-size="20" fill="#edf1ef">椅外側側門繞行到 R20</text><text x="52" y="623" font-size="20" fill="#edf1ef">當前空椅與歷史凝固分層</text><rect x="638" y="496" width="530" height="285" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="658" y="530" font-size="24" fill="#79d8dc">R20 · 觀察側</text><text x="658" y="565" font-size="20" fill="#edf1ef">入口實心擋板 → 控制台／桌下</text><text x="658" y="594" font-size="20" fill="#edf1ef">回全景再自行返回控制台</text><text x="658" y="623" font-size="20" fill="#edf1ef">三軌、段 C、F3、本地驗證各自完成</text><rect x="585" y="505" width="25" height="265" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="490" y="828" font-size="24" fill="#e6bc68">同一片玻璃</text><polyline points="530,720 530,868 665,868 665,750" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><text x="385" y="910" font-size="22" fill="#edf1ef">經側門繞到背面；不是穿過玻璃</text>
<polyline points="32,974 1168,974" fill="none" stroke="#425155" stroke-width="3"/>
<text x="32" y="1006" font-size="20" fill="#b3c1c5">門牌、水痕、布簾與振膜可辨；巡行不新增腳步濺水聲。</text><text x="32" y="1035" font-size="20" fill="#b3c1c5">R19 慢關門與屏息、R20 現場聽覺與歷史聲軌，沿各自安全規則。</text>
<text x="32" y="1075" font-size="18" fill="#b3c1c5">製作圖解 · 非遊戲介面或完成素材 · 正式差分及比例依本房工單驗收</text>
</svg>
