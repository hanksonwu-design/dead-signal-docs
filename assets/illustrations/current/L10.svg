<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="886" viewBox="0 0 1200 886" role="img" aria-labelledby="title desc">
<title id="title">L10｜生活夾層 · 六個操作面板</title><desc id="desc">各房原機構的摘要，不是六房直接相通；實際串接仍依場景與流程。 U1 · B 棟 46F：三片管圖 → 服務門插栓：旋轉管圖核對焊封上支管、住戶橫支管、下彎接頭。
排除死路、確認路線後，仍須手動退栓。；U3 · B 棟 46F：固定燈架 → 橋栓 → 拉桿：斷電裝窄口罩，遮眩光、閉遮光葉、燈框置中。
看清雙刻線，對齊橋栓後親手拉桿落橋。；U4 · B 棟 48F：一次回返 → 三組地標比對：核對門框缺角、扶手焊疤、單結斷邊布。
確認同址後領域仍在，沿冷凝管找檢修蓋。；U4b · 48F 蓋下：掀蓋固定後，另按下降：U4 先鬆外扣、掀蓋並固定支撐。
下降到 U4b 才能操作內銷與服務扣。；U6 · B 棟 49F：三槽 3／0／3 → 2／2／2：左右各移一格水到中槽，總量六格。
親手關閥後，沿固定保養梯下降。；U6b · 49F 蓋下：核水平泡 → 手動止回栓：不踩尚未固定的活動踏面。
確認水平、手動扣栓，固定後才接 R30。</desc>
