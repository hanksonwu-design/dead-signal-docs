="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="911" y="770" font-size="23" fill="#edf1ef">5</text><text x="911" y="830" font-size="26" fill="#e6bc68">6</text><rect x="1005" y="733" width="125" height="118" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="1053" y="770" font-size="23" fill="#edf1ef">6</text><text x="1053" y="830" font-size="26" fill="#e6bc68">2</text><rect x="32" y="902" width="1136" height="112" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="52" y="936" font-size="24" fill="#a6cfa7">製作端解答對照</text><text x="52" y="971" font-size="20" fill="#edf1ef">第二格長痕 → 8；第四格短痕 → 1；依長、短順序得 F3「81」。</text>
