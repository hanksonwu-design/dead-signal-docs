<title id="title">REF-GLASS｜玻璃定位片與六格維護表</title><desc id="desc">格位按缺口計算，不按螢幕左右；玩家先見痕跡，R20 才能讀序位表。；本圖同向展平基準供校核；正式兩側鏡位須保留缺口可辨與相同格號。；先顯答案不作教學；F3 與 F2、三軌、本地驗證各自取得。</desc>
