<text x="32" y="1106" font-size="20" fill="#b3c1c5">本圖同向展平基準供校核；正式兩側鏡位須保留缺口可辨與相同格號。</text><text x="32" y="1135" font-size="20" fill="#b3c1c5">先顯答案不作教學；F3 與 F2、三軌、本地驗證各自取得。</text>
