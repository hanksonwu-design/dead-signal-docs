<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc">
<title id="title">REF-TIME｜七分鐘、十一秒與獨立日期頁</title><desc id="desc">歷史聲軌時間與現在廣播操作分開；完整覆寫碼不單獨打開 C-07。；五段沿原 F1–F5：47／26／81／35／09；未取得的段保持空白。；錯序不重置已核對時間線與 F5；阿彪處置後仍須回 R25 再接 M1。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79d8dc"/></marker></defs>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;letter-spacing:0}</style>
<rect width="1200" height="1280" fill="#0b1418"/>
<text x="32" y="52" font-size="30" fill="#edf1ef">REF-TIME｜七分鐘、十一秒與獨立日期頁</text><text x="32" y="94" font-size="20" fill="#b3c1c5">歷史聲軌時間與現在廣播操作分開；完整覆寫碼不單獨打開 C-07。</text>
<rect x="32" y="140" width="1136" height="355" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="52" y="174" font-size="24" fill="#79d8dc">歷史七分鐘：02:15 → 02:22</text><text x="52" y="209" font-size="20" fill="#edf1ef">02:13 只有準備；02:15 旁路才生效，非現時倒數。</text><polyline points="100,300 1100,300" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><polyline points="100,284 100,315" fill="none" stroke="#e6bc68" stroke-width="3"/><text x="70" y="350" font-size="21" fill="#edf1ef">02:15</text><polyline points="790,284 790,315" fill="none" stroke="#e6bc68" stroke-width="3"/><text x="760" y="350" font-size="21" fill="#edf1ef">02:20</text><polyline points="935,284 935,315" fill="none" stroke="#e6bc68" stroke-width="3"/><text x="905" y="350" font-size="21" fill="#edf1ef">02:21</text><polyline points="1080,284 1080,315" fill="none" stroke="#e6bc68" stroke-width="3"/><text x="1050" y="350" font-size="21" fill="#edf1ef">02:22</text><rect x="650" y="379" width="475" height="70" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="670" y="423" font-size="22" fill="#e6bc68">放大：02:20:11 → 02:20:22＝11 秒</text><rect x="32" y="540" width="530" height="185" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="52" y="574" font-size="24" fill="#a6cfa7">獨立日期頁：48 小時</text><text x="52" y="609" font-size="20" fill="#edf1ef">康備忘／快取失聯對帳／L-48 啟動</text><text x="52" y="638" font-size="20" fill="#edf1ef">以完整日期、日差核對</text><text x="52" y="667" font-size="20" fill="#edf1ef">不塞進七分鐘尺</text><rect x="638" y="540" width="530" height="185" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="658" y="574" font-size="24" fill="#e6bc68">原門端回傳：F5「09」</text><text x="658" y="609" font-size="20" fill="#edf1ef">2025-11-04 02:15 · C-12</text><text x="658" y="638" font-size="20" fill="#edf1ef">VERIFY_ONLY／未開啟</text><text x="658" y="667" font-size="20" fill="#edf1ef">保留前導零；不是小花手寫</text><rect x="32" y="790" width="364" height="140" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="52" y="824" font-size="24" fill="#79d8dc">A · 02:20</text><text x="52" y="859" font-size="20" fill="#edf1ef">內門重新驗證</text><text x="52" y="888" font-size="20" fill="#edf1ef">靜音窗移動、手動關本地開關</text><polyline points="396,860 415,860" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="418" y="790" width="364" height="140" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="438" y="824" font-size="24" fill="#79d8dc">B · 02:21</text><text x="438" y="859" font-size="20" fill="#edf1ef">敏感索引仍在線</text><text x="438" y="888" font-size="20" fill="#edf1ef">靜音窗移動、手動關本地開關</text><polyline points="782,860 801,860" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="804" y="790" width="364" height="140" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="824" y="824" font-size="24" fill="#79d8dc">C · 02:22</text><text x="824" y="859" font-size="20" fill="#edf1ef">下行門禁恢復</text><text x="824" y="888" font-size="20" fill="#edf1ef">靜音窗移動、手動關本地開關</text><rect x="32" y="974" width="1136" height="110" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="52" y="1008" font-size="24" fill="#a6cfa7">對時／E4-05／F5 已成，再做 A → B → C</text><text x="52" y="1043" font-size="20" fill="#edf1ef">每輪播放 5 秒／安靜 3.8 秒；三處切斷後，親自進 R26。</text>
<polyline points="32,1154 1168,1154" fill="none" stroke="#425155" stroke-width="3"/>
<text x="32" y="1186" font-size="20" fill="#b3c1c5">五段沿原 F1–F5：47／26／81／35／09；未取得的段保持空白。</text><text x="32" y="1215" font-size="20" fill="#b3c1c5">錯序不重置已核對時間線與 F5；阿彪處置後仍須回 R25 再接 M1。</text>
<text x="32" y="1255" font-size="18" fill="#b3c1c5">製作圖解 · 非遊戲介面或完成素材 · 正式差分及比例依本房工單驗收</text>
</svg>
