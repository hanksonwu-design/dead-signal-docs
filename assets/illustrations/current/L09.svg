<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="954" viewBox="0 0 1200 954" role="img" aria-labelledby="title desc">
<title id="title">L09｜終幕 · 五種已提交後果</title><desc id="desc">R32 行動決定分支，R33 承接結果；不是片尾再選一次的五格選單。 A · 承認：責任資料完整外送：回返與室內救援後，在 P1 指認責任頁簽名。
承擔不等於獲赦免，也不證明全員獲救。；B · 隱瞞：剪去外送副本的責任路徑：同樣回返並獲救，只交代自己的受困經過。
被剪的是副本，本地原件仍在。；C · 鬆手：搭紙 → 停手 → 主動鬆開：小花自己跨離門框，普通紙留在門邊。
之後回 P1，用空白紀錄紙標出設備位置。；D · 留下：翼內暖光，遠窗仍封閉：主動放棄本次回返，兩椅靠近。
P1 肉身仍昏迷存活，未發求援。
不是死亡或永生。；E · 空位：記得小花，卻失去回應：局部抹除後回返、獲救與照護。
後日桌邊敲兩下，對面沒有第二組回聲。
不是失憶、赦免或勝利。；共同銜接：A／B／C／E 的肉身回返：接回 P1，再以時間切換表達救援與照護。
不讓玩家由 50F 瞬間步行下樓。
D 沿自己的翼內結果收束。</desc>
