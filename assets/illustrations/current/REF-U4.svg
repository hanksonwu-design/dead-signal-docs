<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1441" viewBox="0 0 1200 1441" role="img" aria-labelledby="title desc" data-layout="visual-v1">
<title id="title">REF-U4｜U4 · 同址回返與三組實體地標</title><desc id="desc">B 棟 48F；三地標核實一次回返後才讀解扣銘片。圖為操作摘要，原件全文依本房規格。 先看，再留記號：門框缺角＋焊疤＋單結布：缺角在門框邊，斜尖朝扶手。
一長兩短焊疤，長疤最近立柱。
單結在疤下，長破邊朝下，不是小花雙結。；玩家前移越檻：只一次回到同一鏡位：儲存已回返狀態，停用再次跨檻重播。
仍是原 48F，不傳到別層或另一棟。
留光標記可略過，不占必要解題條件。；手動比對：缺角／焊疤／布結與朝向：將三組前後觀察一一關聯；錯配可拆。
全對後自行確認，同址回返才成立。
門號相同不足以代替三組核對。；確認之後：回返核實後 → 讀片核外扣：領域仍在，循門檻前下彎的冷凝管找到檢修蓋。
實讀檢修蓋解扣銘片，指出外扣可退滑槽與支撐止點；內銷只記銘片所載、待蓋下實查。
核妥上半段後親手退外扣、掀蓋至支撐止點；銘片不是第四個回返地標。；另按下降：蓋撐妥才下降 → 實查內銷：蓋已撐妥才另按下降，仍在 48F 蓋下，不自動落入下一房。
到 U4b 才親見銘片所載內銷與實際拉力片，依現場受力方向抽銷開服務閘，確認固定落腳處後自行通往 U5。
上層開蓋不代替內銷操作或下層通路核對。；概念與交圖：操作摘要，原件全文依本房：材質圖只定構圖與明暗；銘片原字及現場差分依 U4／U4b 規格，圖示不代替實讀。
暗處陰影不作新人物或死因證據。
已比對成果保存，不用重跑回返；已讀原片與蓋下實見分開記錄。</desc>
