<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="988" viewBox="0 0 1200 988" role="img" aria-labelledby="title desc">
<title id="title">REF-U4｜U4 · 同址回返與三組實體地標</title><desc id="desc">B 棟 48F；確認鬼打牆不等於領域解除，真正去路在蓋下。 先看，再留記號：門框缺角＋焊疤＋單結布：缺角在門框邊，斜尖朝扶手。
一長兩短焊疤，長疤最近立柱。
單結在疤下，長破邊朝下，不是小花雙結。；玩家前移越檻：只一次回到同一鏡位：儲存已回返狀態，停用再次跨檻重播。
仍是原 48F，不傳到別層或另一棟。
留光標記可略過，不占必要解題條件。；手動比對：缺角／焊疤／布結與朝向：將三組前後觀察一一關聯；錯配可拆。
全對後自行確認，同址回返才成立。
門號相同不足以代替三組核對。；確認之後：門仍受影響，改循冷凝管：冷凝管在受影響門檻之前下彎。
找到檢修蓋，手動鬆外扣、掀蓋、固定支撐。
不把看清鬼打牆寫成驅散怨靈。；另按下降：U4b · 仍在 48F 蓋下：蓋已撐妥才可下降，不自動落入下一房。
內銷與服務扣到 U4b 才能操作，再接 U5。；概念與交圖：同鏡位差分，不新增來源：材質圖只定構圖與明暗；精確幾何依本圖和工單。
暗處陰影不作新人物或死因證據。
已比對成果保存，不用重跑回返。</desc>
