<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1036" viewBox="0 0 1200 1036" role="img" aria-labelledby="title desc" data-layout="visual-v1">
<title id="title">L06｜R26 · 防禦與停戰分界</title><desc id="desc">每次只判一招；防禦成功不代替查證或最終選擇。 AB-01：壓框來向 → 對側凹位：點凹位自動收手。
成功空台受壓，六秒空檔。；AB-02：拉柄受牽 → 鬆手停操作：停止按鈕與鍵盤操作等效。
成功拉柄回中，六秒空檔。；受擊：回門側安全角：取消未提交操作，保留已查來源。
R26 不增加恐慌或穩定扣罰。；停戰：四來源查證完成：永久停止本輪攻擊，再進處置。
沿原厚門回 R25，不直接通往 M1。</desc>
