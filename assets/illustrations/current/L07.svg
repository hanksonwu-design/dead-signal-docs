<title id="title">L07｜R29～R31 · 責任、繞道與制動</title><desc id="desc">橫跨第七、八幕；下列依序列出路段，不能由 R29 直接走進 R30。 R29 · B 棟 47F：必要比對與選填簽核分開：核對三個月份簽名與提價來源，保存本地索引。
責任停頓後，最後一筆仍可不提交。
關閉選填佇列不封鎖主線。；L2 · 47F → 48F：真假停靠需親自辨識：假停靠門後是實牆，閘門仍鎖住。
真 48F 核對樓牌、平層線與踏面。
親手開閘，經平台再進 U4。；U4 → U4b → U5：48F 領域回返與蓋下繞道：核對同址回返後手動掀蓋，另按下降。
在 U4b 操作內銷，才接 U5 冷藏後場。
不是解除全樓領域或下降到 47F。；U6 → U6b → R30：48F 上行到 49F 再固定踏板：經既有上行路抵達三槽水箱，平水、關閥。
沿固定梯到 49F 蓋下，核水平再扣止回栓。
完成固定才可通 R30。；R30 · B 棟 49F：沉降後親手卡入制動棘爪：先確認剖面，承接沉降。
手動制動固定通往 R31 的維修籠。
制動後回程樓梯封閉，不是反應測試。；R31 · B 棟 50F：本地掛載，再啟動歷史段落：核對門端尾碼、索引與電源，重新掛載冷備份。
硬碟仍留抗震座，尚未外送。
歷史等待靜格後才接唯一 12 秒解凍。</desc>
