<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="734" viewBox="0 0 1200 734" role="img" aria-labelledby="title desc">
<title id="title">V12｜R26 · 阿彪對峙與權限</title><desc id="desc">雙層制服硬殼、反折關節與核可手掌；不是新增武裝敵人。 壓掌 · AB-01：看受力側 · 3.2 秒：肩殼抬起，核可框壓左或右操作台。
退到對側椅邊凹位，點擊自動收手。
只關介面留在壓框內無效。；鉤臂 · AB-02：看被牽的拉柄 · 3.2 秒：背縫反折臂牽動原核可柄。
主動鬆柄、停止操作，雙手退出台沿。
只換凹位卻再碰柄仍會受擊。；必要查證：四來源全齊後停攻：椅上編號、任用文件、命令錄音及處置表。
安全近看與必要台詞不判攻擊。
查證齊備才開放最終處置。；互斥處置：拒絕或本地撤權：拒絕：不再下命令，依原五秒等待。
撤權：核對權限後自行提交原操作。
兩路不同結果；拒絕不代表安息。</desc>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;letter-spacing:0}.title{font-size:32px;font-weight:700;fill:#edf1ef}.subtitle{font-size:21px;fill:#b3c1c5}.phase{font-size:21px;font-weight:700}.panel-title{font-size:26px;font-weight:700;fill:#edf1ef}.body{font-size:22px;fill:#d1dcdf}.footer{font-size:19px;fill:#aebec2}</style>
<rect width="1200" height="734" fill="#0b1418"/>
<text class="title" x="32" y="52">V12｜R26 · 阿彪對峙與權限</text>
<text class="subtitle" x="32" y="91">雙層制服硬殼、反折關節與核可手掌；不是新增武裝敵人。</text>
<g data-panel="1"><rect x="32" y="156" width="558" height="234" rx="4" fill="#152025" stroke="#425155"/>
<rect x="32" y="156" width="5" height="234" fill="#ffa18b"/>
<text class="phase" x="58" y="193" fill="#ffa18b">01 · 壓掌 · AB-01</text>
<text class="panel-title" x="58" y="233">看受力側 · 3.2 秒</text>
<text class="body" x="58" y="276">肩殼抬起，核可框壓左或右操作台。</text>
<text class="body" x="58" y="310">退到對側椅邊凹位，點擊自動收手。</text>
<text class="body" x="58" y="344">只關介面留在壓框內無效。</text></g>
<g data-panel="2"><rect x="610" y="156" width="558" height="234" rx="4" fill="#152025" stroke="#425155"/>
<rect x="610" y="156" width="5" height="234" fill="#ffa18b"/>
<text class="phase" x="636" y="193" fill="#ffa18b">02 · 鉤臂 · AB-02</text>
<text class="panel-title" x="636" y="233">看被牽的拉柄 · 3.2 秒</text>
<text class="body" x="636" y="276">背縫反折臂牽動原核可柄。</text>
<text class="body" x="636" y="310">主動鬆柄、停止操作，雙手退出台沿。</text>
<text class="body" x="636" y="344">只換凹位卻再碰柄仍會受擊。</text></g>
<g data-panel="3"><rect x="32" y="410" width="558" height="234" rx="4" fill="#152025" stroke="#425155"/>
<rect x="32" y="410" width="5" height="234" fill="#79d8dc"/>
<text class="phase" x="58" y="447" fill="#79d8dc">03 · 必要查證</text>
<text class="panel-title" x="58" y="487">四來源全齊後停攻</text>
<text class="body" x="58" y="530">椅上編號、任用文件、命令錄音及處置表。</text>
<text class="body" x="58" y="564">安全近看與必要台詞不判攻擊。</text>
<text class="body" x="58" y="598">查證齊備才開放最終處置。</text></g>
<g data-panel="4"><rect x="610" y="410" width="558" height="234" rx="4" fill="#152025" stroke="#425155"/>
<rect x="610" y="410" width="5" height="234" fill="#a6cfa7"/>
<text class="phase" x="636" y="447" fill="#a6cfa7">04 · 互斥處置</text>
<text class="panel-title" x="636" y="487">拒絕或本地撤權</text>
<text class="body" x="636" y="530">拒絕：不再下命令，依原五秒等待。</text>
<text class="body" x="636" y="564">撤權：核對權限後自行提交原操作。</text>
<text class="body" x="636" y="598">兩路不同結果；拒絕不代表安息。</text></g>
<path d="M32 669H1168" stroke="#425155"/><text class="footer" x="32" y="703">現行規則圖解 · 非遊戲介面或完成素材 · 狀態、差分與計時仍依逐房製作規格</text>
