<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1036" viewBox="0 0 1200 1036" role="img" aria-labelledby="title desc" data-layout="visual-v1">
<title id="title">V12｜R26 · 阿彪對峙與權限</title><desc id="desc">雙層制服硬殼、反折關節與核可手掌；不是新增武裝敵人。 壓掌 · AB-01：看受力側 · 3.2 秒：肩殼抬起，核可框壓左或右操作台。
退到對側椅邊凹位，點擊自動收手。
只關介面留在壓框內無效。；鉤臂 · AB-02：看被牽的拉柄 · 3.2 秒：背縫反折臂牽動原核可柄。
主動鬆柄、停止操作，雙手退出台沿。
只換凹位卻再碰柄仍會受擊。；必要查證：四來源全齊後停攻：椅上編號、任用文件、命令錄音及處置表。
安全近看與必要台詞不判攻擊。
查證齊備才開放最終處置。；互斥處置：拒絕或本地撤權：拒絕：不再下命令，依原五秒等待。
撤權：核對權限後自行提交原操作。
兩路不同結果；拒絕不代表安息。</desc>
