<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400" role="img" aria-labelledby="title desc">
<title id="title">REF-VERSIONS｜三版原件與四人差異</title><desc id="desc">框線、印章與塵點只示核對部位；正式頁面、簽名和完整日期依既有來源。；E4-01／E4-02 與 E3-02 再由玩家提交第四層三格，核對文件不代完成因果板。；同格式不能單獨證明偽造；不把「被騙入園」改成「沒有後來的責任」。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79d8dc"/></marker></defs>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;letter-spacing:0}</style>
<rect width="1200" height="1400" fill="#0b1418"/>
<text x="32" y="52" font-size="30" fill="#edf1ef">REF-VERSIONS｜三版原件與四人差異</text><text x="32" y="94" font-size="20" fill="#b3c1c5">框線、印章與塵點只示核對部位；正式頁面、簽名和完整日期依既有來源。</text>
<rect x="32" y="140" width="364" height="180" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="174" font-size="24" fill="#e6bc68">A 紙本底稿</text><text x="52" y="209" font-size="20" fill="#edf1ef">原工作／誘入承諾／到場分配</text><text x="52" y="238" font-size="20" fill="#edf1ef">完整入境日期</text><circle cx="112" cy="361" r="18" fill="#0b1418" stroke="#e6bc68" stroke-width="3"/><circle cx="166" cy="351" r="4" fill="#0b1418" stroke="#e6bc68" stroke-width="3"/><polyline points="207,340 207,380" fill="none" stroke="#e6bc68" stroke-width="3"/><text x="44" y="420" font-size="20" fill="#edf1ef">日期欄與原職稱須展開</text><rect x="418" y="140" width="364" height="180" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="438" y="174" font-size="24" fill="#e6bc68">B 後補電子檔</text><text x="438" y="209" font-size="20" fill="#edf1ef">建檔晚於入境</text><text x="438" y="238" font-size="20" fill="#edf1ef">面試倒填至入境前三個曆月</text><circle cx="498" cy="361" r="18" fill="#0b1418" stroke="#e6bc68" stroke-width="3"/><circle cx="552" cy="351" r="4" fill="#0b1418" stroke="#e6bc68" stroke-width="3"/><polyline points="593,340 593,380" fill="none" stroke="#e6bc68" stroke-width="3"/><text x="430" y="420" font-size="20" fill="#edf1ef">印章／塵點位置可比對</text><rect x="804" y="140" width="364" height="180" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="824" y="174" font-size="24" fill="#e6bc68">C 二次列印</text><text x="824" y="209" font-size="20" fill="#edf1ef">B 的印章邊＋灰塵點</text><text x="824" y="238" font-size="20" fill="#edf1ef">紙面偏移／非新原始簽署</text><circle cx="884" cy="361" r="18" fill="#0b1418" stroke="#e6bc68" stroke-width="3"/><circle cx="938" cy="351" r="4" fill="#0b1418" stroke="#e6bc68" stroke-width="3"/><polyline points="979,340 979,380" fill="none" stroke="#e6bc68" stroke-width="3"/><text x="816" y="420" font-size="20" fill="#edf1ef">印章／塵點位置可比對</text><polyline points="605,362 800,362" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="469" font-size="22" fill="#edf1ef">B → C 複製特徵</text><rect x="32" y="505" width="1136" height="105" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="52" y="539" font-size="24" fill="#a6cfa7">三版本核對 → 一份碎片 E4-01</text><text x="52" y="574" font-size="20" fill="#edf1ef">文件版本 A／B／C ≠ 調查板碎片 A／B／C；此桌整組確認一次。</text><text x="32" y="664" font-size="27" fill="#a6cfa7">R24 · 四人逐列查證</text><rect x="32" y="700" width="290" height="72" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="734" font-size="24" fill="#e6bc68">本人（R23 已核）</text><text x="52" y="769" font-size="20" fill="#edf1ef"></text><rect x="350" y="700" width="818" height="72" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="370" y="734" font-size="24" fill="#79d8dc">原職缺／面試 → 入境／建檔／倒填 → 轉任／撤號</text><text x="370" y="769" font-size="20" fill="#edf1ef"></text><rect x="32" y="792" width="290" height="72" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="826" font-size="24" fill="#e6bc68">其他管理者一</text><text x="52" y="861" font-size="20" fill="#edf1ef"></text><rect x="350" y="792" width="818" height="72" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="370" y="826" font-size="24" fill="#79d8dc">原職缺／面試 → 入境／建檔／倒填 → 轉任／撤號</text><text x="370" y="861" font-size="20" fill="#edf1ef"></text><rect x="32" y="884" width="290" height="72" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="918" font-size="24" fill="#e6bc68">其他管理者二</text><text x="52" y="953" font-size="20" fill="#edf1ef"></text><rect x="350" y="884" width="818" height="72" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="370" y="918" font-size="24" fill="#79d8dc">原職缺／面試 → 入境／建檔／倒填 → 轉任／撤號</text><text x="370" y="953" font-size="20" fill="#edf1ef"></text><rect x="32" y="976" width="290" height="72" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="1010" font-size="24" fill="#e6bc68">其他管理者三</text><text x="52" y="1045" font-size="20" fill="#edf1ef"></text><rect x="350" y="976" width="818" height="72" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="370" y="1010" font-size="24" fill="#79d8dc">原職缺／面試 → 入境／建檔／倒填 → 轉任／撤號</text><text x="370" y="1045" font-size="20" fill="#edf1ef"></text><rect x="32" y="1110" width="1136" height="110" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="52" y="1144" font-size="24" fill="#79d8dc">共同特徵只作佐證</text><text x="52" y="1179" font-size="20" fill="#edf1ef">共同錯字「記綠」／VF-0818 批次；仍須各人的日期與轉移矛盾 → E4-02</text>
<polyline points="32,1274 1168,1274" fill="none" stroke="#425155" stroke-width="3"/>
<text x="32" y="1306" font-size="20" fill="#b3c1c5">E4-01／E4-02 與 E3-02 再由玩家提交第四層三格，核對文件不代完成因果板。</text><text x="32" y="1335" font-size="20" fill="#b3c1c5">同格式不能單獨證明偽造；不把「被騙入園」改成「沒有後來的責任」。</text>
<text x="32" y="1375" font-size="18" fill="#b3c1c5">製作圖解 · 非遊戲介面或完成素材 · 正式差分及比例依本房工單驗收</text>
</svg>
