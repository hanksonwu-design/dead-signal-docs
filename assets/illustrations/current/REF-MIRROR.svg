<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">REF-MIRROR｜九次鏡像的物件與時間差</title><desc id="desc">點位只示相對動作；R8 不另設秒數，R17 不改成主動分身，R30 不早於制動。；同一主角的當前衣著、背包與疲態；九次都不加 OS、專用音效或追逐。；點陣圖的旁觀對照僅供手勢研究；正式第一人稱鏡位依正文與圖像表。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79d8dc"/></marker></defs>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;letter-spacing:0}</style>
<rect width="1200" height="1000" fill="#0b1418"/>
<text x="32" y="52" font-size="30" fill="#edf1ef">REF-MIRROR｜九次鏡像的物件與時間差</text><text x="32" y="94" font-size="20" fill="#b3c1c5">點位只示相對動作；R8 不另設秒數，R17 不改成主動分身，R30 不早於制動。</text>
<rect x="32" y="140" width="364" height="180" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="174" font-size="24" fill="#e6bc68">1｜P0 · 積水</text><text x="52" y="209" font-size="20" fill="#edf1ef">晚 0.4 秒；主動查看恢復同步</text><polyline points="67,267 359,267" fill="none" stroke="#87999d" stroke-width="3"/><circle cx="157" cy="267" r="8" fill="#0b1418" stroke="#a6cfa7" stroke-width="3"/><circle cx="127" cy="267" r="8" fill="#0b1418" stroke="#dcb3e4" stroke-width="3"/><text x="62" y="302" font-size="18" fill="#b3c1c5">實際動作／反射或主觀差分</text><rect x="418" y="140" width="364" height="180" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="438" y="174" font-size="24" fill="#e6bc68">2｜R1 · 熄滅電視</text><text x="438" y="209" font-size="20" fill="#edf1ef">轉身晚 0.3 秒；近看已同步</text><polyline points="453,267 745,267" fill="none" stroke="#87999d" stroke-width="3"/><circle cx="543" cy="267" r="8" fill="#0b1418" stroke="#a6cfa7" stroke-width="3"/><circle cx="513" cy="267" r="8" fill="#0b1418" stroke="#dcb3e4" stroke-width="3"/><text x="448" y="302" font-size="18" fill="#b3c1c5">實際動作／反射或主觀差分</text><rect x="804" y="140" width="364" height="180" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="824" y="174" font-size="24" fill="#e6bc68">3｜R8 · 拔電螢幕</text><text x="824" y="209" font-size="20" fill="#edf1ef">真手扶椅背；影手已在桌邊</text><polyline points="839,267 1131,267" fill="none" stroke="#87999d" stroke-width="3"/><circle cx="929" cy="267" r="8" fill="#0b1418" stroke="#a6cfa7" stroke-width="3"/><circle cx="959" cy="267" r="8" fill="#0b1418" stroke="#dcb3e4" stroke-width="3"/><text x="834" y="302" font-size="18" fill="#b3c1c5">實際動作／反射或主觀差分</text><rect x="32" y="360" width="364" height="180" rx="4" fill="#152025" stroke="#dcb3e4" stroke-width="2"/><text x="52" y="394" font-size="24" fill="#dcb3e4">4｜R16 · 機櫃玻璃</text><text x="52" y="429" font-size="20" fill="#edf1ef">完全同步；不加時間差</text><polyline points="67,487 359,487" fill="none" stroke="#87999d" stroke-width="3"/><circle cx="157" cy="487" r="8" fill="#0b1418" stroke="#a6cfa7" stroke-width="3"/><circle cx="157" cy="487" r="8" fill="#0b1418" stroke="#dcb3e4" stroke-width="3"/><text x="62" y="522" font-size="18" fill="#b3c1c5">實際動作／反射或主觀差分</text><rect x="418" y="360" width="364" height="180" rx="4" fill="#152025" stroke="#dcb3e4" stroke-width="2"/><text x="438" y="394" font-size="24" fill="#dcb3e4">5｜R17 · 玻璃辦公室</text><text x="438" y="429" font-size="20" fill="#edf1ef">倒影在玻璃內桌前；臉不清</text><polyline points="453,487 745,487" fill="none" stroke="#87999d" stroke-width="3"/><circle cx="543" cy="487" r="8" fill="#0b1418" stroke="#a6cfa7" stroke-width="3"/><circle cx="573" cy="487" r="8" fill="#0b1418" stroke="#dcb3e4" stroke-width="3"/><text x="448" y="522" font-size="18" fill="#b3c1c5">實際動作／反射或主觀差分</text><rect x="804" y="360" width="364" height="180" rx="4" fill="#152025" stroke="#dcb3e4" stroke-width="2"/><text x="824" y="394" font-size="24" fill="#dcb3e4">6｜R22 · 金屬門框</text><text x="824" y="429" font-size="20" fill="#edf1ef">敲擊早 0.3 秒；不代做手勢</text><polyline points="839,487 1131,487" fill="none" stroke="#87999d" stroke-width="3"/><circle cx="929" cy="487" r="8" fill="#0b1418" stroke="#a6cfa7" stroke-width="3"/><circle cx="959" cy="487" r="8" fill="#0b1418" stroke="#dcb3e4" stroke-width="3"/><text x="834" y="522" font-size="18" fill="#b3c1c5">實際動作／反射或主觀差分</text><rect x="32" y="580" width="364" height="180" rx="4" fill="#152025" stroke="#dcb3e4" stroke-width="2"/><text x="52" y="614" font-size="24" fill="#dcb3e4">7｜R25 · 門端金屬邊</text><text x="52" y="649" font-size="20" fill="#edf1ef">接觸早 0.5 秒；不代輸入</text><polyline points="67,707 359,707" fill="none" stroke="#87999d" stroke-width="3"/><circle cx="157" cy="707" r="8" fill="#0b1418" stroke="#a6cfa7" stroke-width="3"/><circle cx="187" cy="707" r="8" fill="#0b1418" stroke="#dcb3e4" stroke-width="3"/><text x="62" y="742" font-size="18" fill="#b3c1c5">實際動作／反射或主觀差分</text><rect x="418" y="580" width="364" height="180" rx="4" fill="#152025" stroke="#dcb3e4" stroke-width="2"/><text x="438" y="614" font-size="24" fill="#dcb3e4">8｜R30 · 粉塵</text><text x="438" y="649" font-size="20" fill="#edf1ef">無反射面；制動穩定後才顯</text><polyline points="453,707 745,707" fill="none" stroke="#87999d" stroke-width="3"/><circle cx="543" cy="707" r="8" fill="#0b1418" stroke="#a6cfa7" stroke-width="3"/><circle cx="573" cy="707" r="8" fill="#0b1418" stroke="#dcb3e4" stroke-width="3"/><text x="448" y="742" font-size="18" fill="#b3c1c5">實際動作／反射或主觀差分</text><rect x="804" y="580" width="364" height="180" rx="4" fill="#152025" stroke="#dcb3e4" stroke-width="2"/><text x="824" y="614" font-size="24" fill="#dcb3e4">9｜R31 · 十二秒解凍</text><text x="824" y="649" font-size="20" fill="#edf1ef">第九次即同一歷史片段轉身</text><polyline points="839,707 1131,707" fill="none" stroke="#87999d" stroke-width="3"/><circle cx="929" cy="707" r="8" fill="#0b1418" stroke="#a6cfa7" stroke-width="3"/><circle cx="959" cy="707" r="8" fill="#0b1418" stroke="#dcb3e4" stroke-width="3"/><text x="834" y="742" font-size="18" fill="#b3c1c5">實際動作／反射或主觀差分</text>
<polyline points="32,874 1168,874" fill="none" stroke="#425155" stroke-width="3"/>
<text x="32" y="906" font-size="20" fill="#b3c1c5">同一主角的當前衣著、背包與疲態；九次都不加 OS、專用音效或追逐。</text><text x="32" y="935" font-size="20" fill="#b3c1c5">點陣圖的旁觀對照僅供手勢研究；正式第一人稱鏡位依正文與圖像表。</text>
<text x="32" y="975" font-size="18" fill="#b3c1c5">製作圖解 · 非遊戲介面或完成素材 · 正式差分及比例依本房工單驗收</text>
</svg>
