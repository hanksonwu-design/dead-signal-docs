<text x="32" y="52" font-size="30" fill="#edf1ef">REF-ASCENT-HIGH｜B 棟 33–36F 到校正入口</text><text x="32" y="94" font-size="20" fill="#b3c1c5">圖號、棟別與單一平台樓層取自正式動線；箭頭表示接景順序，不代表一張連續長樓梯。</text>
<rect x="270" y="135" width="890" height="84" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="290" y="169" font-size="24" fill="#a6cfa7">R17 · B 棟 32F（離幕門已跨過）</text><text x="290" y="204" font-size="20" fill="#edf1ef"></text><polyline points="175,222 175,365" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="257" width="220" height="105" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="291" font-size="24" fill="#e6bc68">33F · B 棟</text><text x="52" y="326" font-size="20" fill="#edf1ef"></text><rect x="270" y="257" width="890" height="105" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="290" y="291" font-size="24" fill="#79d8dc">T-R17-R18-01 · C-02 支路外臺</text><text x="290" y="326" font-size="20" fill="#edf1ef">核踏板接點，繞貨架外側上梯</text><polyline points="175,366 175,509" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="401" width="220" height="105" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="435" font-size="24" fill="#e6bc68">34F · B 棟</text><text x="52" y="470" font-size="20" fill="#edf1ef"></text><rect x="270" y="401" width="890" height="105" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="290" y="435" font-size="24" fill="#79d8dc">T-R17-R18-02 · 貨箱標線隔間</text><text x="290" y="470" font-size="20" fill="#edf1ef">開四角扣檢修蓋，走背板後固定梯</text><polyline points="175,510 175,653" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="545" width="220" height="105" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="579" font-size="24" fill="#e6bc68">35F · B 棟</text><text x="52" y="614" font-size="20" fill="#edf1ef"></text><rect x="270" y="545" width="890" height="105" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="290" y="579" font-size="24" fill="#79d8dc">T-R17-R18-03 · 轉運臺隔柵</text><text x="290" y="614" font-size="20" fill="#edf1ef">空貨臺橫移對孔，壓下繫繩鎖銷</text><polyline points="175,654 175,797" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="689" width="220" height="105" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="723" font-size="24" fill="#e6bc68">36F · B 棟</text><text x="52" y="758" font-size="20" fill="#edf1ef"></text><rect x="270" y="689" width="890" height="105" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="290" y="723" font-size="24" fill="#79d8dc">T-R17-R18-04 · 包覆中的門楣</text><text x="290" y="758" font-size="20" fill="#edf1ef">開護角旁檢修片，沿背後步道上樓</text><polyline points="175,798 175,868 260,868" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="270" y="833" width="890" height="84" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="290" y="867" font-size="24" fill="#a6cfa7">R18 · B 棟 37F 入口安全點</text><text x="290" y="902" font-size="20" fill="#edf1ef"></text>
<polyline points="32,952 1168,952" fill="none" stroke="#425155" stroke-width="3"/>
