<title id="title">REF-ASCENT-HIGH｜B 棟 33–36F 到校正入口</title><desc id="desc">圖號、棟別與單一平台樓層取自正式動線；箭頭表示接景順序，不代表一張連續長樓梯。；已開機構依原條件保存；回訪權限仍按本房與路線。；次場景概念圖中的支架、門框與近看，須逐格對照此圖及圖像表。</desc>
