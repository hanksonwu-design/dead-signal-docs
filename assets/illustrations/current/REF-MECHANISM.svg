<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1441" viewBox="0 0 1200 1441" role="img" aria-labelledby="title desc" data-layout="visual-v1">
<title id="title">REF-MECHANISM｜U3／U6 · 光學與水箱操作拆解</title><desc id="desc">前兩列是不同房間的機關，不是同一個巨型裝置；光照與平水不代替手動固定。 U3 · B 棟 46F：斷電裝完整窄口罩：寬口、裂口、窄口三件依端型與卡榫辨識。
完整窄口罩雙卡榫貼齊，固定燈架不拿走。；U3 · 六種燈架組合：遮光葉開／閉 × 內／中／外：先遮招牌眩光，閉遮光葉、燈框置中。
此組合看清兩條原刻線，不移動刻線。
關燈基準另交，不靠顏色猜答案。；U3 · 機械提交：橋栓對位 → 拉桿全程：偏二／偏一／對齊各交差分。
孔露出後仍須親手拉桿，橋才落下。
完成後關燈不重設橋；捷徑另按原退栓。；U6 · B 棟 49F：三槽守恆：3／0／3 → 2／2／2：左右各移一格到中央，順序任選，總量六。
舊出水口封帽，乾龍頭不是補水來源。
倒影或廢管驚擾不改真實水量。；U6 · 安全下降：手動關閥 → 固定保養梯：重新開閥須再平水、關閥，不可直接走踏面。
沿固定梯到 U6b，仍在 49F 蓋下。；U6b · 最後固定：水平泡居中 → 扣止回栓：確認水平後親手扣栓，固定活動踏面。
只有此時才可通 R30；平水不自動扣栓。
構件外形看材質圖，位置與狀態依原工單。</desc>
