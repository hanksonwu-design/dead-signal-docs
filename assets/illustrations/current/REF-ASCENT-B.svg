<rect width="1200" height="1510" fill="#0b1418"/>
<text x="32" y="52" font-size="30" fill="#edf1ef">REF-ASCENT-B｜B 棟 16–22F 與同層跨棟</text><text x="32" y="94" font-size="20" fill="#b3c1c5">圖號、棟別與單一平台樓層取自正式動線；箭頭表示接景順序，不代表一張連續長樓梯。</text>
<rect x="270" y="135" width="890" height="84" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="290" y="169" font-size="24" fill="#a6cfa7">R11 · B 棟 15F（單向門已跨過）</text><text x="290" y="204" font-size="20" fill="#edf1ef"></text><polyline points="175,222 175,365" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="257" width="220" height="105" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="291" font-size="24" fill="#e6bc68">16F · B 棟</text><text x="52" y="326" font-size="20" fill="#edf1ef"></text><rect x="270" y="257" width="890" height="105" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="290" y="291" font-size="24" fill="#79d8dc">T-R11-R12-01 · 舊插線交換間</text><text x="290" y="326" font-size="20" fill="#edf1ef">沿完整接頭與踏板入缺口</text><polyline points="175,366 175,509" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="401" width="220" height="105" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="435" font-size="24" fill="#e6bc68">17F · B 棟</text><text x="52" y="470" font-size="20" fill="#edf1ef"></text><rect x="270" y="401" width="890" height="105" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="290" y="435" font-size="24" fill="#79d8dc">T-R11-R12-02 · 水塔下的租戶廚房</text><text x="290" y="470" font-size="20" fill="#edf1ef">選溢流旁通，排水後走塔腳短梯</text><polyline points="175,510 175,653" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="545" width="220" height="105" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="579" font-size="24" fill="#e6bc68">18F · B 棟</text><text x="52" y="614" font-size="20" fill="#edf1ef"></text><rect x="270" y="545" width="890" height="105" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="290" y="579" font-size="24" fill="#79d8dc">T-R11-R12-03 · 電線盤迴廊</text><text x="290" y="614" font-size="20" fill="#edf1ef">鬆卡榫，空盤架沿導槽推至止擋</text><polyline points="175,654 175,797" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="689" width="220" height="105" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="723" font-size="24" fill="#e6bc68">19F · B 棟</text><text x="52" y="758" font-size="20" fill="#edf1ef"></text><rect x="270" y="689" width="890" height="105" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="290" y="723" font-size="24" fill="#79d8dc">T-R11-R12-04 · 修鞋店後牆</text><text x="290" y="758" font-size="20" fill="#edf1ef">暗側連續腳踏與護欄才接上行口</text><polyline points="175,798 175,941" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="833" width="220" height="105" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="867" font-size="24" fill="#e6bc68">20F · B 棟</text><text x="52" y="902" font-size="20" fill="#edf1ef"></text><rect x="270" y="833" width="890" height="105" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="290" y="867" font-size="24" fill="#79d8dc">T-R11-R12-05 · 封存工具外間</text><text x="290" y="902" font-size="20" fill="#edf1ef">折梯兩側扣已到位，直接循梯上行</text><polyline points="175,942 175,1085" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="977" width="220" height="105" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="1011" font-size="24" fill="#e6bc68">21F · B 棟</text><text x="52" y="1046" font-size="20" fill="#edf1ef"></text><rect x="270" y="977" width="890" height="105" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="290" y="1011" font-size="24" fill="#79d8dc">T-R11-R12-06 · 舊搬運井外圈</text><text x="290" y="1046" font-size="20" fill="#edf1ef">橋板只跨同層窄溝，扣妥另一端</text><polyline points="175,1086 175,1229" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="1121" width="220" height="105" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="1155" font-size="24" fill="#e6bc68">22F · B 棟</text><text x="52" y="1190" font-size="20" fill="#edf1ef"></text><rect x="270" y="1121" width="890" height="105" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="290" y="1155" font-size="24" fill="#79d8dc">T-R11-R12-07 · 打包機後側跨棟橋</text><text x="290" y="1190" font-size="20" fill="#edf1ef">本地停機 → B22F 橋 → A22F → 短梯</text><polyline points="175,1230 175,1300 260,1300" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="270" y="1265" width="890" height="84" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="290" y="1299" font-size="24" fill="#a6cfa7">R12 · A 棟 23F</text><text x="290" y="1334" font-size="20" fill="#edf1ef"></text>
<polyline points="32,1384 1168,1384" fill="none" stroke="#425155" stroke-width="3"/>
