<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1036" viewBox="0 0 1200 1036" role="img" aria-labelledby="title desc" data-layout="visual-v1">
<title id="title">V30｜下部生活區 · 逐房操作與領域</title><desc id="desc">操作摘要與原件全文依逐房規格；U1～U3 在 B 棟 46F，經 R28／R29、L2 才到 48F U4。 U1：讀覆核籤 → 核管圖形刻 → 退栓：移架後讀圖框背側分租改管覆核籤，再旋妥三片管圖。
核對上支封止、住戶支單橫刻及井側雙凹口短節與實際去向，然後親手開服務門插栓。
籤留本房；已讀來源、已核對結果與返回入口分開保存。；U2：洗衣內井與橋下夾層：操作原機構通往 U2b。
威脅仍沿原入口確認與安全撤離，不全區追逐。；U3：讀牌核雙記 → 手動落橋：固定座正面檢修校驗牌在配罩／調燈前後皆可讀；配罩、遮光與三位燈框沿原操作，牌文不給燈角答案。
照清後核一記在固定座、一記隨動栓移；完整拉桿前須實讀、核對及當前橋栓對齊皆成立，再手動落橋。
燈架固定留場；燈亮不自動開門，送件門另開閂。；U4：核一次回返 → 讀片核扣 → 開蓋：由既定上行路與 47F→48F L2 抵達。
核三組原地標確認一次同址回返後，才讀檢修蓋解扣銘片、核外扣滑槽與支撐止點並掀蓋固定。
領域仍在；內銷須下降到 U4b 實查，不把銘片加作第四地標或再繞一圈。</desc>
