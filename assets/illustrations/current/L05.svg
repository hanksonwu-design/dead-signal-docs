<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="886" viewBox="0 0 1200 886" role="img" aria-labelledby="title desc">
<title id="title">L05｜校正區 · 三房各自承接</title><desc id="desc">R18、R19、R20 均在 B 棟 37F；不是一段不停歇的追逐。 R18：01 · 觀察巡行：先辨正常巡行肩影、門牌與水痕。
現場帶只顯示已發生的原聲源。；R18：02 · 移動與退避：依掩體和原屏息要求前進。
失誤退回已到達安全位，成功才進門。；R19：03 · 慢關厚門：2.4 秒累積收合，放手可暫停，連點不加速。
當前椅位是空椅；厚門提供原遮蔽。；R19：04 · 屏息與凝固分層：至少 3.2 秒前兆後，確認才進 5.2 秒停留。
原歷史人體靜止，不畫成現在椅上住戶。；R20：05 · 玻璃反射與來源：玻璃輪廓是走廊反射，不是新增完整怨靈。
三條波形是歷史來源播放器，不是雷達。；R20：06 · 比對與操作：歷史播放器與新增現場聽覺帶分框。
完成原校正條件後，仍需親自操作前進。</desc>
