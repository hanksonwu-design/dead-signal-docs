<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc">
<title id="title">REF-BRAKE｜R30 雙路、沉降與手動制動</title><desc id="desc">B 棟 49F → 50F R31；樓面約三度沉降與可點桿保持可辨。；零凝神／零光能仍能完成；不是限時自動失敗或自動拉桿過場。；制動與歷史 H-07 播放分開；維修籠不等於電梯，推車不是玩家載具。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79d8dc"/></marker></defs>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;letter-spacing:0}</style>
<rect width="1200" height="1010" fill="#0b1418"/>
<text x="32" y="52" font-size="30" fill="#edf1ef">REF-BRAKE｜R30 雙路、沉降與手動制動</text><text x="32" y="94" font-size="20" fill="#b3c1c5">B 棟 49F → 50F R31；樓面約三度沉降與可點桿保持可辨。</text>
<rect x="32" y="140" width="1136" height="120" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="52" y="174" font-size="24" fill="#79d8dc">五組來源比對 → 玩家提交「繼續」</text><text x="52" y="209" font-size="20" fill="#edf1ef">取得 E5-06 並鎖定後續路線；此時只是提交，後方階梯尚未因制動封住。</text><rect x="32" y="310" width="530" height="310" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="344" font-size="24" fill="#e6bc68">空推車導軌</text><text x="52" y="379" font-size="20" fill="#edf1ef">三輛空車依次滑向焊死核心門</text><text x="52" y="408" font-size="20" fill="#edf1ef">末車翻底：腕帶／水瓶／空白標籤</text><text x="52" y="437" font-size="20" fill="#edf1ef">核心門一直焊封，不是玩家去路</text><rect x="638" y="310" width="530" height="310" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="658" y="344" font-size="24" fill="#a6cfa7">單人維修籠通道</text><text x="658" y="379" font-size="20" fill="#edf1ef">玩家仍在制動桿旁</text><text x="658" y="408" font-size="20" fill="#edf1ef">手動拉桿 → 棘爪扣入</text><text x="658" y="437" font-size="20" fill="#edf1ef">籠固定於 49F，不升降、不載人</text><rect x="95" y="510" width="94" height="64" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><rect x="225" y="510" width="94" height="64" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><rect x="355" y="510" width="94" height="64" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><polyline points="900,620 900,663" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="638" y="680" width="530" height="140" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="658" y="714" font-size="24" fill="#79d8dc">制動扣妥之後</text><text x="658" y="749" font-size="20" fill="#edf1ef">後方梯段隨機構封閉</text><text x="658" y="778" font-size="20" fill="#edf1ef">前方踏點可走，穿固定籠上短梯</text><rect x="32" y="680" width="530" height="140" rx="4" fill="#152025" stroke="#dcb3e4" stroke-width="2"/><text x="52" y="714" font-size="24" fill="#dcb3e4">鏡像第八次另開安全鏡位</text><text x="52" y="749" font-size="20" fill="#edf1ef">制動已穩才在粉塵顯同衣站姿</text><text x="52" y="778" font-size="20" fill="#edf1ef">不遮制動桿，不與點桿判定重疊</text>
<polyline points="32,884 1168,884" fill="none" stroke="#425155" stroke-width="3"/>
<text x="32" y="916" font-size="20" fill="#b3c1c5">零凝神／零光能仍能完成；不是限時自動失敗或自動拉桿過場。</text><text x="32" y="945" font-size="20" fill="#b3c1c5">制動與歷史 H-07 播放分開；維修籠不等於電梯，推車不是玩家載具。</text>
<text x="32" y="985" font-size="18" fill="#b3c1c5">製作圖解 · 非遊戲介面或完成素材 · 正式差分及比例依本房工單驗收</text>
</svg>
