<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="666" viewBox="0 0 1200 666" role="img" aria-labelledby="title desc">
<title id="title">ART02｜小花 · 庇護與封閉的顯示界線</title><desc id="desc">人的身量不變；巨翼占據房間，不把小花放大成人形巨像。 揭露之前：熟悉的人形與手：只用正文指定人形、袖口與局部。
完整巨翼和四鬚仍未顯示。；三源核對之後：室內低垂翼拱：粉質巨翼沿內牆折下，四鬚兩左兩右。
厚褶與透紅薄緣包住窗柱，原地標不移。；庇護轉封閉：同一室內視點：柔軟近翼與封死遠窗同框。
正常人形居中，壓迫由房間收攏構成。；分支之後：按已提交結果收束：A／B／C 放行，D 合翼留下，E 錨點鬆斷。
不共用漂亮半展翼或安息消散當全部結局。</desc>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;letter-spacing:0}.title{font-size:32px;font-weight:700;fill:#edf1ef}.subtitle{font-size:21px;fill:#b3c1c5}.phase{font-size:21px;font-weight:700}.panel-title{font-size:26px;font-weight:700;fill:#edf1ef}.body{font-size:22px;fill:#d1dcdf}.footer{font-size:19px;fill:#aebec2}</style>
<rect width="1200" height="666" fill="#0b1418"/>
<text class="title" x="32" y="52">ART02｜小花 · 庇護與封閉的顯示界線</text>
<text class="subtitle" x="32" y="91">人的身量不變；巨翼占據房間，不把小花放大成人形巨像。</text>
<g data-panel="1"><rect x="32" y="156" width="558" height="200" rx="4" fill="#152025" stroke="#425155"/>
<rect x="32" y="156" width="5" height="200" fill="#79d8dc"/>
<text class="phase" x="58" y="193" fill="#79d8dc">01 · 揭露之前</text>
<text class="panel-title" x="58" y="233">熟悉的人形與手</text>
<text class="body" x="58" y="276">只用正文指定人形、袖口與局部。</text>
<text class="body" x="58" y="310">完整巨翼和四鬚仍未顯示。</text></g>
<g data-panel="2"><rect x="610" y="156" width="558" height="200" rx="4" fill="#152025" stroke="#425155"/>
<rect x="610" y="156" width="5" height="200" fill="#79d8dc"/>
<text class="phase" x="636" y="193" fill="#79d8dc">02 · 三源核對之後</text>
<text class="panel-title" x="636" y="233">室內低垂翼拱</text>
<text class="body" x="636" y="276">粉質巨翼沿內牆折下，四鬚兩左兩右。</text>
<text class="body" x="636" y="310">厚褶與透紅薄緣包住窗柱，原地標不移。</text></g>
<g data-panel="3"><rect x="32" y="376" width="558" height="200" rx="4" fill="#152025" stroke="#425155"/>
<rect x="32" y="376" width="5" height="200" fill="#79d8dc"/>
<text class="phase" x="58" y="413" fill="#79d8dc">03 · 庇護轉封閉</text>
<text class="panel-title" x="58" y="453">同一室內視點</text>
<text class="body" x="58" y="496">柔軟近翼與封死遠窗同框。</text>
<text class="body" x="58" y="530">正常人形居中，壓迫由房間收攏構成。</text></g>
<g data-panel="4"><rect x="610" y="376" width="558" height="200" rx="4" fill="#152025" stroke="#425155"/>
<rect x="610" y="376" width="5" height="200" fill="#79d8dc"/>
<text class="phase" x="636" y="413" fill="#79d8dc">04 · 分支之後</text>
<text class="panel-title" x="636" y="453">按已提交結果收束</text>
<text class="body" x="636" y="496">A／B／C 放行，D 合翼留下，E 錨點鬆斷。</text>
<text class="body" x="636" y="530">不共用漂亮半展翼或安息消散當全部結局。</text></g>
<path d="M32 601H1168" stroke="#425155"/><text class="footer" x="32" y="635">現行規則圖解 · 非遊戲介面或完成素材 · 狀態、差分與計時仍依逐房製作規格</text>
</svg>
