<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="988" viewBox="0 0 1200 988" role="img" aria-labelledby="title desc">
<title id="title">REF-HEARING｜現場波形 · 察覺與失敗分界</title><desc id="desc">聲音大小不是距離或危險值；各房原聲源、視覺前兆與遭遇判定共同成立。 現在／歷史：現場帶與來源播放器分開：現場帶只顯當下可聽聲；日期聲軌另框。
配樂、選單音、歷史錄音不混入現場判讀。；正常巡行：側耳不代表已發現：看門影、水痕、布簾與方向字幕。
波形歸平只表示無可辨聲，不顯示安全。
靜音與關波形仍保留非聲音前兆。；校正區補救：失誤後 2.2 秒內接受退避：沿已走路回有效安全位，使用實際退程。
不瞬移，也不能利用失敗抵達未走掩體。
補救不套用其他 Boss 或 UD 招式。；安全查證：完整來源停攻停表：完整閱讀、調查板與必要台詞受保護。
一般速查與只停錄音不等於暫停世界。
回操作給原完整前兆，未完成仍需應對。；被抓與保存：按該房規則，不統一即死：校正區回已到達有效安全位，保留來源與步驟。
恐慌沿原代價；Boss 與 UD 各依原受擊規則。
已解除遭遇不因重播聲音復活。；圖層交付：聲源／字幕／波形讀同一時鐘：方向不明就如實標示，不揭穿牆座標。
低動態以短條與文字取代滾動，不改成本。
真暫停、失焦、讀檔不殘留上一輪波峰。</desc>
