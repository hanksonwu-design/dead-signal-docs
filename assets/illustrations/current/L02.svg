<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="886" viewBox="0 0 1200 886" role="img" aria-labelledby="title desc">
<title id="title">L02｜R1 · 三人叫號與通路</title><desc id="desc">設備、椅列與內門維持同一方向；不是向玩家逼近的追擊。 01 · 初入：三張空椅：先查舊出口、電視、指派號牌與機台功能。
櫃檯後內門仍關著，窄口被殘影占住。；02 · 殘留出現：同批三人候坐：查完指定來源後三人才出現。
號牌由管理者指派，沒有自助取號口。；03 · 第一號：身體先起，頭影後接：張口被提示音蓋過。
低頭影由衣領折頸接回，轉往櫃檯後內門。；04 · 第二號：縮肩後被迫撐笑：眼神與呼吸仍恐懼，號牌握緊。
沿同一通道走向內門，不向玩家聚攏。；05 · 第三號：抓椅抗拒，膝先轉：仍看焊死出口，上身留椅，手指逐節滑脫。
最後仍被叫號帶向內門，手影最後淡去。；06 · 通路留下：空椅與關閉的內門：三人淡去，窄口讓路；不是安息或獲救。
玩家自行走到鎖舌損壞的內門，再親手開門。</desc>
