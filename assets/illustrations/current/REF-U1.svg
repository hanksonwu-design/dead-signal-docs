<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
<title id="title">REF-U1｜三片管圖與實體端點</title><desc id="desc">操作摘要；分租改管覆核籤全文依 U1 規格，旋圖初態與管線形仍按 U1-C02／C03 製作。；先實讀覆核籤，再旋圖核對封止、單橫刻與雙凹口現物去向，最後手動退栓。；向下維修道是既有去路；送件門另開內閂，三片旋圖、核現物與開門分開回饋。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79d8dc"/></marker></defs>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;letter-spacing:0}</style>
<rect width="1200" height="960" fill="#0b1418"/>
<text x="32" y="52" font-size="30" fill="#edf1ef">REF-U1｜三片管圖與實體端點</text><text x="32" y="94" font-size="20" fill="#b3c1c5">操作摘要；分租改管覆核籤全文依 U1 規格，旋圖初態與管線形仍按 U1-C02／C03 製作。</text>
<rect x="32" y="140" width="1136" height="108" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="52" y="174" font-size="24" fill="#79d8dc">U1 · 移架讀覆核籤，再旋三片管圖</text><text x="52" y="209" font-size="20" fill="#edf1ef">架腳墊磚與上格擋片保留；依籤核對實際接頭形刻與去向。</text><rect x="70" y="310" width="150" height="150" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><polyline points="70,385 220,385" fill="none" stroke="#79d8dc" stroke-width="3"/><text x="102" y="502" font-size="24" fill="#e6bc68">第 1 片</text><polyline points="220,385 279,385" fill="none" stroke="#79d8dc" stroke-width="3"/><rect x="280" y="310" width="150" height="150" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><polyline points="280,385 430,385" fill="none" stroke="#79d8dc" stroke-width="3"/><text x="312" y="502" font-size="24" fill="#e6bc68">第 2 片</text><polyline points="430,385 489,385" fill="none" stroke="#79d8dc" stroke-width="3"/><rect x="490" y="310" width="150" height="150" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><polyline points="490,385 640,385" fill="none" stroke="#79d8dc" stroke-width="3"/><text x="522" y="502" font-size="24" fill="#e6bc68">第 3 片</text><text x="85" y="558" font-size="24" fill="#edf1ef">各片可旋轉；接頭須相續</text><polyline points="700,385 800,385 800,290 910,290" fill="none" stroke="#79d8dc" stroke-width="3"/><polyline points="800,385 910,385" fill="none" stroke="#79d8dc" stroke-width="3"/><polyline points="800,385 800,500 910,500" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="925" y="252" width="230" height="80" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="945" y="286" font-size="24" fill="#e6bc68">上支管</text><text x="945" y="321" font-size="20" fill="#edf1ef">焊封／不通</text><rect x="925" y="347" width="230" height="80" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="945" y="381" font-size="24" fill="#e6bc68">橫支／單橫刻</text><text x="945" y="416" font-size="20" fill="#edf1ef">回住戶水槽</text><rect x="925" y="462" width="230" height="80" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="945" y="496" font-size="24" fill="#a6cfa7">下彎／雙凹口</text><text x="945" y="531" font-size="20" fill="#edf1ef">續向內井</text><rect x="32" y="625" width="530" height="155" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="52" y="659" font-size="24" fill="#79d8dc">接頭不合／點錯端點</text><text x="52" y="694" font-size="20" fill="#edf1ef">保留目前位置，回圖片重查</text><text x="52" y="723" font-size="20" fill="#edf1ef">錯門可見封帽或水槽</text><rect x="638" y="625" width="530" height="155" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="658" y="659" font-size="24" fill="#a6cfa7">籤文、管圖與現物核妥後</text><text x="658" y="694" font-size="20" fill="#edf1ef">手動退普通插栓 → 推門進 U2</text><text x="658" y="723" font-size="20" fill="#edf1ef">拼圖成功不代替開門</text>
<polyline points="32,834 1168,834" fill="none" stroke="#425155" stroke-width="3"/>
<text x="32" y="866" font-size="20" fill="#b3c1c5">先實讀覆核籤，再旋圖核對封止、單橫刻與雙凹口現物去向，最後手動退栓。</text><text x="32" y="895" font-size="20" fill="#b3c1c5">向下維修道是既有去路；送件門另開內閂，三片旋圖、核現物與開門分開回饋。</text>
<text x="32" y="935" font-size="18" fill="#b3c1c5">製作圖解 · 非遊戲介面或完成素材 · 正式差分及比例依本房工單驗收</text>
</svg>
