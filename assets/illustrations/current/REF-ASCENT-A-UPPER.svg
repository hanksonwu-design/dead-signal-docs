<rect x="270" y="135" width="890" height="84" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="290" y="169" font-size="24" fill="#a6cfa7">R5 · A 棟 8F</text><text x="290" y="204" font-size="20" fill="#edf1ef"></text><polyline points="175,222 175,365" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="257" width="220" height="105" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="291" font-size="24" fill="#e6bc68">9F · A 棟</text><text x="52" y="326" font-size="20" fill="#edf1ef"></text><rect x="270" y="257" width="890" height="105" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="290" y="291" font-size="24" fill="#79d8dc">T-R5-R6-01 · 共用熱水槽</text><text x="290" y="326" font-size="20" fill="#edf1ef">掛回濾籃，開旁通露踏板</text><polyline points="175,366 175,509" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="401" width="220" height="105" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="435" font-size="24" fill="#e6bc68">10F · A 棟</text><text x="52" y="470" font-size="20" fill="#edf1ef"></text><rect x="270" y="401" width="890" height="105" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="290" y="435" font-size="24" fill="#79d8dc">T-R5-R6-02 · 送衣吊籃背側</text><text x="290" y="470" font-size="20" fill="#edf1ef">空籃到限位並插止擋銷，人走旁梯</text><text x="291" y="529" font-size="19" fill="#a6cfa7">先進 R6（11F）完成本房，再續往 12F</text><polyline points="175,510 175,653" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="545" width="220" height="105" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="579" font-size="24" fill="#e6bc68">12F · A 棟</text><text x="52" y="614" font-size="20" fill="#edf1ef"></text><rect x="270" y="545" width="890" height="105" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="290" y="579" font-size="24" fill="#79d8dc">T-R6-R7-01 · 分租電錶走廊</text><text x="290" y="614" font-size="20" fill="#edf1ef">沿服務線槽撥檢修扇門閂</text><polyline points="175,654 175,797" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="689" width="220" height="105" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="723" font-size="24" fill="#e6bc68">13F · A 棟</text><text x="52" y="758" font-size="20" fill="#edf1ef"></text><rect x="270" y="689" width="890" height="105" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="290" y="723" font-size="24" fill="#79d8dc">T-R6-R7-02 · 天井晾衣層</text><text x="290" y="758" font-size="20" fill="#edf1ef">推空衣架，找水箱工作臺固定梯</text><polyline points="175,798 175,941" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="833" width="220" height="105" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="867" font-size="24" fill="#e6bc68">14F · A 棟</text><text x="52" y="902" font-size="20" fill="#edf1ef"></text><rect x="270" y="833" width="890" height="105" rx="4" fill="#152025" stroke="#79d8dc" stroke-width="2"/><text x="290" y="867" font-size="24" fill="#79d8dc">T-R6-R7-03 · 封窗候工道</text><text x="290" y="902" font-size="20" fill="#edf1ef">沿門底磨痕開工作通道上樓</text><polyline points="175,942 175,1012 260,1012" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="270" y="977" width="890" height="84" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="290" y="1011" font-size="24" fill="#a6cfa7">R7 · A 棟 15F</text><text x="290" y="1046" font-size="20" fill="#edf1ef"></text>
<polyline points="32,1096 1168,1096" fill="none" stroke="#425155" stroke-width="3"/>
<text x="32" y="1128" font-size="20" fill="#b3c1c5">已開機構依原條件保存；回訪權限仍按本房與路線。</text><text x="32" y="1157" font-size="20" fill="#b3c1c5">次場景概念圖中的支架、門框與近看，須逐格對照此圖及圖像表。</text>
