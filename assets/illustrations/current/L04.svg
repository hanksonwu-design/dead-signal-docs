<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1036" viewBox="0 0 1200 1036" role="img" aria-labelledby="title desc" data-layout="visual-v1">
<title id="title">L04｜R15 · 三種互斥供電方案</title><desc id="desc">先看代價，再完成一種機構；三路都保留必要主線證據。 選擇之前：三路並列，不是四步連做：先查各路與暫存紀錄代價。
完成所選機構並確認，才保存供電。
必要主線來源不因方案消失。；部分供電：先接醫療與核心：接妥兩組斷路器後繼續原調查。
完成技術核心調查才回 R12 切辦公室繼電器。
仍需持本地憑據驗證門端。；全面供電：備援後三次穩壓：依表針與刻度調校，首輪 30 秒。
錯誤只重做當次，調校期間無遭遇。
完成恢復設備，不代替後續門端驗證。；定向供電：冷卻 → 核心 → 索引 → 中繼：按原可重看操作記憶，親手依序輸入。
確認本地路由回饋後保存。
熟悉權限不等於抹除或自動完成推理。</desc>
