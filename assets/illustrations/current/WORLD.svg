<title id="title">WORLD｜雙棟動線與生活管理</title><desc id="desc">48 個主節點／72 個次場景／56 條動線；正式圖像 557 列均待製作。 跨棟橋：同層連接，不垂直跳樓：15F A 棟 → B 棟：T-R7-R8-02
22F B 棟 → A 棟：T-R11-R12-07
26F A 棟 → B 棟：T-R12-R14-03
26F A 棟 → B 棟：T-R13-R14-03
26F A 棟 → B 棟：T-R13-R15-03
26F A 棟 → B 棟：T-R12-R15-03；拉閘門電梯：只到既有停靠樓層：L1 車廂首次上行：29F → 30F
L1 車廂第二段上行：30F → 31F
L2 冷藏線車廂：47F → 48F
L1 必須完成 30F 平台；L2 假停靠不開閘。；逐層探路：坍塌不代表整層不存在：2F→8F、15F→31F、32F→41F 依原次場景逐層辨路。
已開通路按原條件回訪，沒有直達捷徑替代。；集體管理：共用生活空間：R4：2F 集體衛浴。
R6：11F 食堂與配膳回收。
房內探索鏡位不冒充跨房主線。；主管套間：生活差異不等於自由：R29：47F 本人與其他主管的生活套間。
獨立衛浴仍受管理；外部聯絡權限只屬康。；外界與素材：紅霧、白絲與可辨地標：窗縫外維持紅霧與白絲，不畫可自由出去的街景。
圖像工單 557 列包含多頁和差分，不是同數量的獨立背景。</desc>
