<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="734" viewBox="0 0 1200 734" role="img" aria-labelledby="title desc">
<title id="title">V29｜上部收尾 · 完成當部，再留下懸念</title><desc id="desc">R22 在 B 棟 42F；先解通路並親自跨門，不是鎖門後突然中斷。 通路成果：手勢或手動路擇一完成：原踏面落位、扶手和釋放通路可辨。
完成原門檻後，玩家主動跨門。；懸念：布結、空掌與向內的蛾：已看 R8 者可比對同一布結。
手鬆開，掌心留空；灰蛾往內飛。
不提前揭露小花完整蛾形或離體答案。；當部完成：跨門保存 → 片尾：完成保存後才進上部片尾。
收束已完成的逃離校正區成果。
保留未解關係，不用單張「未完待續」代替。；下部：承接或獨立開局：承接讀取上部合法成果。
獨立開局依原基準狀態，不虛構上部選擇。
兩路沿同一 R23 正式入口。</desc>
