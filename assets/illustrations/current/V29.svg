<title id="title">V29｜上部收尾 · 完成當部，再留下懸念</title><desc id="desc">R22 在 B 棟 42F；先解通路並親自跨門，不是鎖門後突然中斷。 通路成果：手勢或手動路擇一完成：四次接觸或雙鎖完成，原踏面落位。
先自行走到安全踏台，再另點深層出口。；懸念：布結、空掌與向內的蛾：已看 R8 者可比對同一布結。
手鬆開，掌心留空；灰蛾往內飛。
不提前揭露小花完整蛾形或離體答案。；當部完成：跨門保存 → 片尾：完成保存後才進上部片尾。
收束突破校正前段封鎖的成果。
保留未解關係，不用單張「未完待續」代替。；下部：承接或獨立開局：以小花所在與分離疑問接原版本查證。
僅回查已有來源，不補播未聽門檻台詞。
兩路沿同一 R23 正式入口。</desc>
