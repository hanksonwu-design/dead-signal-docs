<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1036" viewBox="0 0 1200 1036" role="img" aria-labelledby="title desc" data-layout="visual-v1">
<title id="title">REF-R12｜R12 · 低壓接頭與獨立權限核驗</title><desc id="desc">A 棟 23F；修好電路只恢復供電，不自動取得門禁權限。 挑件：圓口／裂方口／完整方口：原方口低壓插座只收完整方口接頭。
核對端型、低壓標記與完整卡榫，再壓入。；追線：先看終點、套環與接座刻記：雙短線門禁線 → 右座。
長線設備線 → 左座。
一座一線，不只憑長短或左右猜。；測試：收手、合護蓋，再試主斷路器：兩片試驗片都立起，才保存修復。
錯接只跳脫，可復位重試，不扣資源。
修好顯示供電正常／待權限核驗。；權限：本地帳號另作完整比對：依原外側門禁紀錄核對完整帳號與角色。
自動帶入前綴不等於完成驗證。
後續部分供電回訪只操作原辦公室繼電器。</desc>
