<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="title desc">
<title id="title">REF-THAW｜R31 唯一十二秒歷史解凍</title><desc id="desc">同一歷史鏡位接續八拍；必要核驗、第五層鎖定完成後才呈現。；動畫或八拍等價摘要擇一完成取得 E5-05；可暫停與保存續接。；點陣分鏡只定光影與姿態；右拇指、固定鏡位及揭臉時機以本圖驗收。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79d8dc"/></marker></defs>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;letter-spacing:0}</style>
<rect width="1200" height="1160" fill="#0b1418"/>
<text x="32" y="52" font-size="30" fill="#edf1ef">REF-THAW｜R31 唯一十二秒歷史解凍</text><text x="32" y="94" font-size="20" fill="#b3c1c5">同一歷史鏡位接續八拍；必要核驗、第五層鎖定完成後才呈現。</text>
<rect x="32" y="140" width="250" height="80" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="174" font-size="24" fill="#e6bc68">0.0–1.0 秒</text><text x="52" y="209" font-size="20" fill="#edf1ef"></text><rect x="315" y="140" width="853" height="80" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="335" y="174" font-size="24" fill="#a6cfa7">管理者持平板，小花停門側；絕對靜默</text><text x="335" y="209" font-size="20" fill="#edf1ef"></text><polyline points="155,220 155,240" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="244" width="250" height="80" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="278" font-size="24" fill="#e6bc68">1.0–2.2 秒</text><text x="52" y="313" font-size="20" fill="#edf1ef"></text><rect x="315" y="244" width="853" height="80" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="335" y="278" font-size="24" fill="#a6cfa7">只有右拇指先動：核可移交</text><text x="335" y="313" font-size="20" fill="#edf1ef"></text><polyline points="155,324 155,344" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="348" width="250" height="80" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="382" font-size="24" fill="#e6bc68">2.2–3.6 秒</text><text x="52" y="417" font-size="20" fill="#edf1ef"></text><rect x="315" y="348" width="853" height="80" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="335" y="382" font-size="24" fill="#a6cfa7">工作人員帶小花離框，臉與傷勢不呈現</text><text x="335" y="417" font-size="20" fill="#edf1ef"></text><polyline points="155,428 155,448" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="452" width="250" height="80" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="486" font-size="24" fill="#e6bc68">3.6–5.0 秒</text><text x="52" y="521" font-size="20" fill="#edf1ef"></text><rect x="315" y="452" width="853" height="80" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="335" y="486" font-size="24" fill="#a6cfa7">管理者仍在，只轉平板角度繼續看</text><text x="335" y="521" font-size="20" fill="#edf1ef"></text><polyline points="155,532 155,552" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="556" width="250" height="80" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="590" font-size="24" fill="#e6bc68">5.0–8.4 秒</text><text x="52" y="625" font-size="20" fill="#edf1ef"></text><rect x="315" y="556" width="853" height="80" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="335" y="590" font-size="24" fill="#a6cfa7">側臉留在螢幕光裡 3.4 秒，內容不可見</text><text x="335" y="625" font-size="20" fill="#edf1ef"></text><polyline points="155,636 155,656" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="660" width="250" height="80" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="694" font-size="24" fill="#e6bc68">8.4–10.4 秒</text><text x="52" y="729" font-size="20" fill="#edf1ef"></text><rect x="315" y="660" width="853" height="80" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="335" y="694" font-size="24" fill="#a6cfa7">往下滑、關閉可見畫面，不證明刪原件</text><text x="335" y="729" font-size="20" fill="#edf1ef"></text><polyline points="155,740 155,760" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="764" width="250" height="80" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="798" font-size="24" fill="#e6bc68">10.4–11.2 秒</text><text x="52" y="833" font-size="20" fill="#edf1ef"></text><rect x="315" y="764" width="853" height="80" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="335" y="798" font-size="24" fill="#a6cfa7">看空位，未按撤回；原建築低頻進入</text><text x="335" y="833" font-size="20" fill="#edf1ef"></text><polyline points="155,844 155,864" fill="none" stroke="#79d8dc" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="868" width="250" height="80" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="52" y="902" font-size="24" fill="#e6bc68">11.2–12.0 秒</text><text x="52" y="937" font-size="20" fill="#edf1ef"></text><rect x="315" y="868" width="853" height="80" rx="4" fill="#152025" stroke="#a6cfa7" stroke-width="2"/><text x="335" y="902" font-size="24" fill="#a6cfa7">轉向鏡頭，臉與黑平板自我反射重合</text><text x="335" y="937" font-size="20" fill="#edf1ef"></text>
<polyline points="32,1034 1168,1034" fill="none" stroke="#425155" stroke-width="3"/>
<text x="32" y="1066" font-size="20" fill="#b3c1c5">動畫或八拍等價摘要擇一完成取得 E5-05；可暫停與保存續接。</text><text x="32" y="1095" font-size="20" fill="#b3c1c5">點陣分鏡只定光影與姿態；右拇指、固定鏡位及揭臉時機以本圖驗收。</text>
<text x="32" y="1135" font-size="18" fill="#b3c1c5">製作圖解 · 非遊戲介面或完成素材 · 正式差分及比例依本房工單驗收</text>
</svg>
