ight="224" rx="4" fill="#152025" stroke="#e6bc68" stroke-width="2"/><text x="658" y="590" font-size="24" fill="#e6bc68">原排程單：沿紙角折痕展開</text><polyline points="1040,615 1040,690 1120,690" fill="none" stroke="#e6bc68" stroke-width="3" stroke-dasharray="8 6"/><rect x="660" y="666" width="82" height="65" rx="4" fill="#152025" stroke="#87999d" stroke-width="2"/><rect x="755" y="666" width="82" height="65" rx="4" fill="#152025" stroke="#87999d" stroke-width="2"/><rect x="850" y="666" width="82" height="65" rx="4" fill="#152025" stroke="#87999d" stroke-width="2"/><rect x="945" y="666" width="82" height="65" rx="4" fill="#152025" stroke="#87999d" stroke-width="2"/><rect x="1040" y="666" width="82" height="65" rx="4" fill="#152025" stroke="#87999d" stroke-width="2"/><text x="964" y="709" font-size="26" fill="#e6bc68">35</text><text x="658" y="762" font-size="22" fill="#edf1ef">F4：第四格 35</text>
