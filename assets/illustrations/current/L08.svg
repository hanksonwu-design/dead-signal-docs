<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="666" viewBox="0 0 1200 666" role="img" aria-labelledby="title desc">
<title id="title">L08｜R32 · 三種前兆配三個固定鏡位</title><desc id="desc">前三格各列一招的前兆與應對；地標不隨翼膜或灰粉移動。 掃線：腰高黑鬚：前兆：灰粉擦出腰高線。
應對：桌下低位；成功看見掃過桌面。；抱繭：向桌下與兩側合膜：前兆：門框內側退線仍可見。
應對：收手退過線；薄膜合在空位。；灰粉：相似門框：前兆：灰粉造出假門輪廓。
應對：循斷鉚釘和連續扶手進真壁龕。；原場景不變：三個退位可互相定位：桌沿、柱腳、真門框與扶手保留。
每拍之間停攻，自行轉位並確認下一拍。</desc>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;letter-spacing:0}.title{font-size:32px;font-weight:700;fill:#edf1ef}.subtitle{font-size:21px;fill:#b3c1c5}.phase{font-size:21px;font-weight:700}.panel-title{font-size:26px;font-weight:700;fill:#edf1ef}.body{font-size:22px;fill:#d1dcdf}.footer{font-size:19px;fill:#aebec2}</style>
<rect width="1200" height="666" fill="#0b1418"/>
<text class="title" x="32" y="52">L08｜R32 · 三種前兆配三個固定鏡位</text>
<text class="subtitle" x="32" y="91">前三格各列一招的前兆與應對；地標不隨翼膜或灰粉移動。</text>
<g data-panel="1"><rect x="32" y="156" width="558" height="200" rx="4" fill="#152025" stroke="#425155"/>
<rect x="32" y="156" width="5" height="200" fill="#79d8dc"/>
<text class="phase" x="58" y="193" fill="#79d8dc">01 · 掃線</text>
<text class="panel-title" x="58" y="233">腰高黑鬚</text>
<text class="body" x="58" y="276">前兆：灰粉擦出腰高線。</text>
<text class="body" x="58" y="310">應對：桌下低位；成功看見掃過桌面。</text></g>
<g data-panel="2"><rect x="610" y="156" width="558" height="200" rx="4" fill="#152025" stroke="#425155"/>
<rect x="610" y="156" width="5" height="200" fill="#79d8dc"/>
<text class="phase" x="636" y="193" fill="#79d8dc">02 · 抱繭</text>
<text class="panel-title" x="636" y="233">向桌下與兩側合膜</text>
<text class="body" x="636" y="276">前兆：門框內側退線仍可見。</text>
<text class="body" x="636" y="310">應對：收手退過線；薄膜合在空位。</text></g>
<g data-panel="3"><rect x="32" y="376" width="558" height="200" rx="4" fill="#152025" stroke="#425155"/>
<rect x="32" y="376" width="5" height="200" fill="#79d8dc"/>
<text class="phase" x="58" y="413" fill="#79d8dc">03 · 灰粉</text>
<text class="panel-title" x="58" y="453">相似門框</text>
<text class="body" x="58" y="496">前兆：灰粉造出假門輪廓。</text>
<text class="body" x="58" y="530">應對：循斷鉚釘和連續扶手進真壁龕。</text></g>
<g data-panel="4"><rect x="610" y="376" width="558" height="200" rx="4" fill="#152025" stroke="#425155"/>
<rect x="610" y="376" width="5" height="200" fill="#79d8dc"/>
<text class="phase" x="636" y="413" fill="#79d8dc">04 · 原場景不變</text>
<text class="panel-title" x="636" y="453">三個退位可互相定位</text>
<text class="body" x="636" y="496">桌沿、柱腳、真門框與扶手保留。</text>
<text class="body" x="636" y="530">每拍之間停攻，自行轉位並確認下一拍。</text></g>
<path d="M32 601H1168" stroke="#425155"/><text class="footer" x="32" y="635">現行規則圖解 · 非遊戲介面或完成素材 · 狀態、差分與計時仍依逐房製作規格</text>
</svg>
