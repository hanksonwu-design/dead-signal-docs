<title id="title">L08｜R32 · 三種前兆配三個固定鏡位</title><desc id="desc">前三格各列一招的前兆與應對；地標不隨翼膜或灰粉移動。 掃線：腰高黑鬚：前兆：灰粉擦出腰高線。
應對：桌下低位；成功看見掃過桌面。；抱繭：向桌下與兩側合膜：前兆：門框內側退線仍可見。
應對：收手退過線；薄膜合在空位。；灰粉：相似門框：前兆：灰粉造出假門輪廓。
應對：循斷鉚釘和連續扶手進真壁龕。；原場景不變：三個退位可互相定位：桌沿、柱腳、真門框與扶手保留。
每拍之間停攻，自行轉位並確認下一拍。</desc>
