<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1441" viewBox="0 0 1200 1441" role="img" aria-labelledby="title desc" data-layout="visual-v1">
<title id="title">CORE｜核心循環 · 調查、判斷、操作與回報</title><desc id="desc">現場機關與推理各有門檻；不是所有前進都需要三格鎖定。 探索：主圖 → 原件近看：主場景與過渡次場景各有對應圖號。
關閉近看回原鏡位；出入口狀態可辨。；來源：物證／聲證／影證／文證：保存已取得的來源與已知範圍。
同一來源可依現有內容有多種型態。；推理：有指定鏈時才排 A → B → C：核對有關聯的三片，排列原因果。
正確後才鎖定結論；錯配可退回查原件。
三片不是每間房的固定收集數。；操作：看該段成功條件：機關需親手操作；推理結論不自動開所有門。
原必要操作成功後，才成立對應通行條件。；威脅：只在指定暴露階段：觀察聲音、輪廓與前兆，選相應避位。
必要查證安全；失誤保留原已得成果。；回報：路開／來源保存／人物更新：看得見操作結果，再自行移動。
依原條件回訪，接下一輪不同情境。</desc>
