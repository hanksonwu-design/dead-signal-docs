<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="914" viewBox="0 0 1100 914" role="img" aria-labelledby="title desc">
  <title id="title">R11 出入口配置草圖</title>
  <desc id="desc">「你的」座位（第三排靠牆）。來路只保留門框側緣；不能從另一入口繞到敵後或跨房躲避。。來路／返回：隔板後長巷：第三排工位後側、半層門檻接回短租房的通道口。 非鎖場時可回 R9；遭遇中只能使用同房安全凹位，不能跨房躲避。 另一來路／返回：平台側門：工位另一側的柱角與平台門框，接回祈禱角。 非鎖場時可回 R10；兩個入口都落在原安全邊界外，不從敵後進場。 出口：S-03 服務梯門：靠牆工位旁的門端，門框外接上行扶手。 完成阿尋必要校驗、幕尾推理與第一鑰匙現場驗證，再確認離幕；經三段服務梯到 R12，確認前仍可整理回訪。</desc>
  <rect width="1100" height="914" fill="#fbfcfc"/>
  <g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#233536" letter-spacing="0">
    <text x="40" y="52" font-size="30" font-weight="700">R11 · 「你的」座位（第三排靠牆） / 出入口配置</text>
    <text x="40" y="92" font-size="20" >固定鏡位提案 · 非比例平面圖 · 非遊戲背景完成稿</text>
    <path d="M40 125H1060V600H40Z" fill="#eef4f3" stroke="#a8b8b7" stroke-width="2"/>
    <path d="M260 140H840V325H260Z M260 325L80 580H1020L840 325" fill="none" stroke="#bbc9c8" stroke-width="2"/>
    <rect x="380" y="302" width="340" height="88" fill="#dce8e5" stroke="#a8b8b7"/>
    <text x="550" y="337" font-size="23" text-anchor="middle" font-weight="700">三排工位與安全邊界</text>
    <text x="550" y="373" font-size="20" text-anchor="middle">入口均在遭遇邊界外</text>
    <g data-port="1">
      <rect x="70" y="432" width="260" height="96" fill="white" stroke="#aa582a" stroke-width="3"/>
      <text x="84" y="464" font-size="22" font-weight="700">1. 隔板後長巷</text>
      <text x="84" y="497" font-size="17" fill="#aa582a">鎖場時停用</text>
    </g>
<g data-port="2">
      <rect x="770" y="432" width="260" height="96" fill="white" stroke="#aa582a" stroke-width="3"/>
      <text x="784" y="464" font-size="22" font-weight="700">2. 平台側門</text>
      <text x="784" y="497" font-size="17" fill="#aa582a">鎖場時停用</text>
    </g>
<g data-port="3">
      <rect x="755" y="172" width="260" height="96" fill="white" stroke="#aa582a" stroke-width="3"/>
      <text x="769" y="204" font-size="22" font-weight="700">3. S-03 服務梯門</text>
      <text x="769" y="237" font-size="17" fill="#aa582a">必要驗證後單向</text>
    </g>
    <text x="550" y="580" font-size="17" text-anchor="middle">主鏡位：由前景看向後景；反向回訪不水平翻圖</text>
    <text x="60" y="665" font-size="22" >1. 前景左側   R9↔R11</text>
<text x="60" y="713" font-size="22" >2. 前景右側   R10↔R11</text>
<text x="60" y="761" font-size="22" >3. 後景右側   R11→R12</text>
    <text x="40" y="852" font-size="21" >來路只保留門框側緣；不能從另一入口繞到敵後或跨房躲避。</text>
    <text x="40" y="889" font-size="18" >完整門檻以本房出入口表及動線表為準；未知去向不提前顯示給玩家。</text>
  </g>
</svg>
