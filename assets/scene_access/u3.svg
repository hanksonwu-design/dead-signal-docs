<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="914" viewBox="0 0 1100 914" role="img" aria-labelledby="title desc">
  <title id="title">U3 出入口配置草圖</title>
  <desc id="desc">燈具修理工場。送件廊沿核心柱接回 U1，使用 U3-V02；R30 不可逆提交後停用。。來路／返回：晾架橋口：工場進場門檻外接已清通的原橋面，側階與扶手指回手輪作業位。 沉降前可沿已清通橋路回 U2b，不重做收架。 出口：遮光服務橋：46F 門端，去路可辨46F → 47F 服務橋後交易梯的連續扶手及固定梯口；目的房在 47F，不把兩端畫成同層相鄰門。 斷電、裝妥窄燈罩並完成原橋栓操作後可通行；回程仍以同一遮光結構辨向。 後開捷徑：柱後送件門：核心柱旁的窄門，內閂原被維修支架擋住；落橋後支架收回，露出把手。 先完成管圖、收架與工場落橋，再親手退閂才開通。可經送件廊回 U1，不必使用，也不綁回憶收集。</desc>
  <rect width="1100" height="914" fill="#fbfcfc"/>
  <g font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" fill="#233536" letter-spacing="0">
    <text x="40" y="52" font-size="30" font-weight="700">U3 · 燈具修理工場 / 出入口配置</text>
    <text x="40" y="92" font-size="20" >固定鏡位提案 · 非比例平面圖 · 非遊戲背景完成稿</text>
    <path d="M40 125H1060V600H40Z" fill="#eef4f3" stroke="#a8b8b7" stroke-width="2"/>
    <path d="M260 140H840V325H260Z M260 325L80 580H1020L840 325" fill="none" stroke="#bbc9c8" stroke-width="2"/>
    <rect x="380" y="302" width="340" height="88" fill="#dce8e5" stroke="#a8b8b7"/>
    <text x="550" y="337" font-size="23" text-anchor="middle" font-weight="700">核心柱與維修支架</text>
    <text x="550" y="373" font-size="20" text-anchor="middle">支架收回才露送件內閂</text>
    <g data-port="1">
      <rect x="70" y="432" width="260" height="96" fill="white" stroke="#147469" stroke-width="3"/>
      <text x="84" y="464" font-size="22" font-weight="700">1. 晾架橋口</text>
      <text x="84" y="497" font-size="17" fill="#147469">已清通的原橋面</text>
    </g>
<g data-port="2">
      <rect x="755" y="172" width="260" height="96" fill="white" stroke="#aa582a" stroke-width="3"/>
      <text x="769" y="204" font-size="22" font-weight="700">2. 遮光服務橋</text>
      <text x="769" y="237" font-size="17" fill="#aa582a">修燈、橋栓完成後</text>
    </g>
<g data-port="3">
      <rect x="85" y="172" width="260" height="96" fill="white" stroke="#aa582a" stroke-width="3"/>
      <text x="99" y="204" font-size="22" font-weight="700">3. 柱後送件門</text>
      <text x="99" y="237" font-size="17" fill="#aa582a">落橋後另行手動退閂</text>
    </g>
    <text x="550" y="580" font-size="17" text-anchor="middle">主鏡位：由前景看向後景；反向回訪不水平翻圖</text>
    <text x="60" y="665" font-size="22" >1. 前景左側   U2b↔U3</text>
<text x="60" y="713" font-size="22" >2. 後景右側   U3↔R28</text>
<text x="60" y="761" font-size="22" >3. 後景左側   U3↔U1</text>
    <text x="40" y="852" font-size="21" >送件廊沿核心柱接回 U1，使用 U3-V02；R30 不可逆提交後停用。</text>
    <text x="40" y="889" font-size="18" >完整門檻以本房出入口表及動線表為準；未知去向不提前顯示給玩家。</text>
  </g>
</svg>
