name: Build docs.json

# Regenerates docs.json from docs/**/*.md whenever the Markdown changes,
# then commits it so GitHub Pages (deploy from main) picks it up.
on:
  push:
    branches: [main]
    paths: ["docs/**", "tools/build-docs.mjs"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: |
          if node tools/build-docs.mjs --check; then exit 0; fi
          node tools/build-docs.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add docs.json
          git commit -m "Rebuild docs.json from Markdown"
          git push
