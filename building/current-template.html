<header><div><h1>灰燈寨 · 全劇場景模型</h1><small id="counts">B3 → 50F</small></div><nav><a id="editor-link" href="editor.html">舊配置沙盒 ↗</a><a id="flow-link" href="../#scene=R6">關卡流程 ↗</a></nav></header>
<main class="layout">
<aside class="left" aria-label="場景篩選"><div class="controls"><label>場景搜尋<input id="search" type="search" placeholder="編號或名稱" autocomplete="off"></label><label>章節<select id="act"><option value="all">全部章節</option></select></label><label>所在樓層<select id="floor"><option value="all">雙棟</option></select></label><label>模型範圍<select id="scope"><option value="all">雙棟</option><option value="act">目前章節</option><option value="route">目前路線</option></select></label><label>樓層高度<select id="height"><option value="compressed">壓縮概覽</option><option value="actual">等距樓層</option></select></label></div><div class="checks"><label><input id="labels" type="checkbox" checked>編號</label><label><input id="shots" type="checkbox" checked>次場景</label><label title="顯示或隱藏樓層參考線框與其標籤"><input id="floor-guides" type="checkbox" checked>樓層線框</label></div><ul id="scene-list" aria-label="場景節點"></ul><p id="empty" class="reading" hidden>沒有符合的場景</p></aside>

</main>
