<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灰燈寨｜操作因果試玩</title>
<style>body{background:#0b141c;color:#e6e8e7;font:17px/1.7 system-ui;margin:0}main{max-width:940px;margin:auto;padding:40px 24px}h1{margin:0}p{color:#acbbc3}button,select{font:inherit;background:#152630;color:#e6e8e7;border:1px solid #587381;border-radius:7px;padding:10px 16px;cursor:pointer;margin:5px}button:hover{border-color:#eabc70}button:focus-visible{outline:3px solid #eabc70}.panel{padding:24px;background:#101f29;border:1px solid #304552;border-radius:12px;margin:20px 0}.message{font-size:22px;color:#edc681;min-height:90px}a{color:#89d3d3}.tag{color:#89d3d3}li{font-size:14px;color:#b7c8cd}small{color:#b7c8cd}</style>
<main><small>灰燈寨 · 設計驗證</small><h1>操作因果試玩</h1><p>五個獨立邏輯切片。沒有正式畫面、音效、遊戲存檔或完整關卡。怨影以「推演攻擊」逐拍檢查判斷，<strong>不模擬即時秒數；UD-02 本切片首次固定從左側</strong>，不能據此評估恐怖感或通關時間。</p><a href="/#scene=R22">回文件導覽</a><div><label>段落 <select id="pick"></select></label><button id="restart">重新試玩本段</button></div><section class="panel"><div id="title" class="tag"></div><p id="state"></p><div id="message" class="message" role="status" aria-live="polite"></div><div id="actions"></div></section><details><summary>本次操作紀錄</summary><ol id="events"></ol></details><p>觀察重點：能否說出判斷依據？錯誤回饋能否幫助修正？開路成果是否清楚？原型使用文字表達所有線索，正式鏡位的可讀性仍須重新測試。</p></main>
<script type="module">
import {names,start,act} from './playtest-model.mjs';
const groups={r12:['觀察','圓形接頭','裂開方形接頭','完整方形接頭','接上回路'],r22:['觀察','手勢路','手動路','敲門框','掌心下壓','解 A 扣','拉 B 桿','走到安全踏台','深層出口','跨門'],u4:['觀察','繫布標','穿過內門','核對地標','鬆外扣','進入 U4b','抽內銷'],ud1:['觀察','開始前兆','躲掩蔽','推演攻擊','轉搖輪','安全復位','重新觀察'],ud2:['觀察','開始前兆','隔板擋左','隔板擋右','躲掩蔽','推演攻擊','封住來向側','安全復位','重新觀察']};
let s=start('r12');const $=x=>document.getElementById(x);
for(const [id,name] of Object.entries(names)){const o=document.createElement('option');o.value=id;o.textContent=name;$('pick').append(o);}
function render(){ $('title').textContent=names[s.id];$('state').textContent=s.done?'本段完成':`階段：${s.phase} · 已完成步驟：${s.step}${s.reset?' · 需要復位':''}`;$('message').textContent=s.msg;$('actions').replaceChildren();for(const a of groups[s.id]){const b=document.createElement('button');b.textContent=a;b.disabled=s.done;b.onclick=()=>{s=act(s,a);render();};$('actions').append(b);}$('events').replaceChildren();for(const e of s.events){const li=document.createElement('li');li.textContent=e.action;$('events').append(li);}}
$('pick').onchange=()=>{s=start($('pick').value);render();};$('restart').onclick=()=>{s=start($('pick').value);render();};render();
</script></html>
